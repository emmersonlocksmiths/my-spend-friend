<script>
// Theme: 'auto' follows the phone's light/dark setting; saved per device.
(function(){
  const KEY='myspendfriend.theme', mq=matchMedia('(prefers-color-scheme: light)');
  function apply(){
    let pref='auto'; try{ pref=localStorage.getItem(KEY)||'auto'; }catch(e){}
    const t=pref==='auto'?(mq.matches?'light':'dark'):pref;
    document.documentElement.dataset.theme=t;
    const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=t==='light'?'#f5f4f0':'#0b0b0c';
  }
  window.getThemePref=()=>{ try{ return localStorage.getItem(KEY)||'auto'; }catch(e){ return 'auto'; } };
  window.setThemePref=p=>{ try{ localStorage.setItem(KEY,p); }catch(e){} apply(); };
  (mq.addEventListener?mq.addEventListener('change',apply):mq.addListener(apply));
  apply(); document.addEventListener('DOMContentLoaded',apply);
})();
</script>
<style>

  --track:#272622;--trendbar:#5c4a1c;--trendtext:#e2dfd8;--pending:#6b5418;--navbg:rgba(14,14,17,.96);--placeholder:#6d6d78;--chipfg:#c9c9d2;--autofg:#9fb8ff;
  --toastbg:#ffffff;--toastfg:#111111;--openborder:#4a3e1e;--dashed:#3d3a33;--rawtext:#77746d;--errfg:#ffb3b4;--strong:#ffffff;--glow:rgba(245,179,1,.08);--shadow:rgba(0,0,0,.5);--overlay:rgba(0,0,0,.65);color-scheme:dark}

  --track:#ebe8e1;--trendbar:#f1d58a;--trendtext:#3a3833;--pending:#f0d48a;--navbg:rgba(255,255,255,.96);--placeholder:#a5a199;--chipfg:#4f4c45;--autofg:#2f5fc4;
  --toastbg:#1d1c19;--toastfg:#ffffff;--openborder:#ecd28c;--dashed:#d6d1c5;--rawtext:#9a968d;--errfg:#a3222a;--strong:#1d1c19;--glow:rgba(227,164,0,.10);--shadow:rgba(0,0,0,.15);--overlay:rgba(20,18,14,.45);color-scheme:light}

:root[data-theme=light] nav button .ic{filter:grayscale(1) brightness(.9);opacity:.55}
:root[data-theme=light] nav button.on .ic{filter:none;opacity:1}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-x:none}

input,select,textarea{font-size:16px!important}

  background-image:radial-gradient(1200px 500px at 50% -200px,var(--glow),transparent 70%);background-repeat:no-repeat;min-height:100vh;min-height:100dvh}

.navind{position:absolute;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--accent);box-shadow:0 0 10px var(--accent);
  width:calc(100% / var(--n,5) * .4);left:calc(100% / var(--n,5) * (var(--i,0) + .3));transition:left .28s cubic-bezier(.3,.7,.2,1)}

nav button .ic{transition:filter .2s,opacity .2s,transform .2s}
nav button.on .ic{transform:translateY(-1px) scale(1.06)}

button.btn{background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--onaccent);border:0;border-radius:11px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 2px 12px rgba(245,179,1,.22)}

input[type=checkbox]{accent-color:var(--accent)}

.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}

table.simple td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}

ol.steps{padding-left:20px;margin:6px 0;line-height:1.6;font-size:14px}

summary{color:var(--accent)}
.chg{font-size:11px;margin-top:3px;white-space:nowrap}
.mini2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.sharebar i{display:block;height:100%}

.mini3 .k{font-size:11px;color:var(--muted)}
.mini3 .v{font-size:18px;font-weight:800;margin-top:2px}
.catcard{cursor:pointer;padding:14px}

.acct{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card2)}
.acct input,.acct select{background:var(--bg)}

.suggrow button b{display:block}
.suggrow button .why{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.suggrow button.sel{background:var(--accent);color:var(--onaccent)}
.authwrap{max-width:420px;margin:24px auto;padding:0 4px}
.authcard{padding:22px}
.authcard input{background:var(--bg)}
.authmsg{background:rgba(255,77,79,.1);border:1px solid rgba(255,77,79,.35);color:var(--errfg);border-radius:10px;padding:9px 11px;font-size:13px;margin:4px 0 10px}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:40px auto 14px;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- Transitions ---------- */
.anim-tab{animation:tabIn .24s cubic-bezier(.2,.7,.2,1)}
@keyframes tabIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim-fade{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:.25}to{opacity:1}}
.anim-left{animation:inFromRight .22s cubic-bezier(.2,.7,.2,1)}
.anim-right{animation:inFromLeft .22s cubic-bezier(.2,.7,.2,1)}
@keyframes inFromRight{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inFromLeft{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.rvanim{transition:transform .15s ease,opacity .15s ease}
.rvanim.out-left{transform:translateX(-36px);opacity:0}
.rvanim.out-right{transform:translateX(36px);opacity:0}
.qpgrid button.picked,.suggrow button.picked,.catgrid button.picked{border-color:var(--accent);background:var(--soft);transform:scale(.97)}
.modal-bg{animation:bgIn .2s ease}
.modal-bg .modal{animation:sheetUp .26s cubic-bezier(.2,.8,.2,1)}
.modal-bg.closing{animation:bgOut .2s ease forwards}
.modal-bg.closing .modal{animation:sheetDown .2s ease forwards}
@keyframes bgIn{from{opacity:0}}
@keyframes bgOut{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}}
@keyframes sheetDown{to{transform:translateY(40px);opacity:0}}
@media(min-width:600px){@keyframes sheetUp{from{transform:translateY(16px) scale(.98);opacity:0}}}
.anim-open{animation:openDown .22s cubic-bezier(.2,.7,.2,1)}
@keyframes openDown{from{opacity:0;transform:translateY(-6px)}}
details[open]>summary~*{animation:openDown .2s ease}
.toast{animation:toastIn .22s cubic-bezier(.2,.8,.2,1)}
.toast.hide{transition:opacity .25s,transform .25s;opacity:0;transform:translateX(-50%) translateY(8px)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}}
button,.btn,.catrow,.crow,.txn,.lrow,.chip,.seg button,.qpgrid button,.suggrow button,.catgrid button,.period button{transition:transform .12s ease,background-color .2s,border-color .2s,color .2s,box-shadow .2s,opacity .2s}
button:active:not(:disabled),.txn:active,.catrow:active,.crow:active{transform:scale(.97)}
.txn:active,.crow:active,.catrow:active{transform:scale(.99)}
[onclick]:not(button):not(input):not(select):not(.modal-bg):not(.modal):not(#app):not(body){transition:transform .14s ease,background-color .2s,box-shadow .2s}
[onclick]:not(button):not(input):not(select):not(.modal-bg):not(.modal):not(#app):not(body):not(.card):active{transform:scale(.985)}
.card[onclick]:active,.snapcard:active,.recapcard:active,.cmpcard[onclick]:active{transform:scale(.99)}
label.rolltog:active,label.linkrow:active,.chip:active{transform:scale(.98)}
.seg button,.chip,.pill,.btn,.link{transition:transform .14s ease,background-color .22s ease,color .22s ease,border-color .22s ease,box-shadow .22s ease}
.donut-in{animation:donutIn .7s cubic-bezier(.2,.7,.2,1)}.donut-fade{animation:donutFade .35s ease}@keyframes donutFade{from{opacity:.4;transform:scale(.97)}}
@keyframes donutIn{from{transform:rotate(-100deg) scale(.82);opacity:0}to{transform:none;opacity:1}}
.donut{transform-origin:50% 50%}
.budnote,.budgetnote,.budhint,.goalrow{transition:color .25s ease}
@media (prefers-reduced-motion: reduce){ .donut-in{animation:none} [onclick]:active{transform:none!important} }
.bar i,.crow-bar i,.sharebar i{transition:width .35s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<header><img src="banner.jpg" alt="My Spend Friend"><span class="ver" id="verTag" hidden></span><button class="avatar" id="avatarBtn" hidden onclick="toggleUserMenu(event)" aria-label="Your account and settings"></button></header>

<script>
/* App version: bump on every push (and VERSION in sw.js to match). */
const APP_VERSION='0.72';

/* ============ Storage (Firebase cloud sync) ============ */
// Data lives in Firestore (see the module script at the bottom). save() works out what changed
// since the last sync and sends only that: changed/removed transactions and the household settings.
const VIEW_KEY='myspendfriend.view';
let cloud=null;                 // set once signed in: {saveMeta(meta), saveTxns(sets,dels)}
let synced=new Map();           // transaction id -> JSON as last synced
let lastMeta='';                // household settings JSON as last synced
let metaDirty=false, metaPending=0, metaWaiting=null, metaLast=null;            // local settings change not yet sent
function metaOf(s){ return {categories:s.categories,rules:s.rules,accounts:s.accounts||{},recent:s.recent||[],imports:(s.imports||[]).slice(-50),payCycle:s.payCycle||null,dupOk:(s.dupOk||[]).slice(-300),autoCat:s.autoCat!==false,projects:s.projects||[],projSeeded:!!s.projSeeded,catDeleted:(s.catDeleted||[]).slice(-100),budRoll:s.budRoll||null,avatars:s.avatars||{},tax:s.tax||null}; }
function save(){
  recordBudChanges();
  try{ localStorage.setItem(VIEW_KEY,JSON.stringify(state.view)); }catch(e){}
  if(!cloud) return;
  const m=JSON.stringify(metaOf(state));
  if(m!==lastMeta){ lastMeta=m; metaDirty=true; cloud.saveMeta(JSON.parse(m)); }
  const sets=[],dels=[],now=new Set();
  for(const t of state.txns){ now.add(t.id); const j=JSON.stringify(t); if(synced.get(t.id)!==j){ sets.push(t); synced.set(t.id,j); } }
  for(const id of [...synced.keys()]) if(!now.has(id)){ dels.push(id); synced.delete(id); }
  if(sets.length||dels.length) cloud.saveTxns(sets,dels);
}
let renderQueued=false;
function scheduleRender(){ if(renderQueued) return; renderQueued=true; requestAnimationFrame(()=>{ renderQueued=false; if(appScreen==='app') render(); }); }
// Called by the Firebase module when data arrives (first load, or a change from another phone).
function applyCloudMeta(meta){
  if(metaDirty) return; // our own newer change is on its way
  if(!meta){ return; }
  const localNewer={projects:state.projects,projSeeded:state.projSeeded,dupOk:state.dupOk,autoCat:state.autoCat,catDeleted:state.catDeleted,budRoll:state.budRoll,avatars:state.avatars,tax:state.tax};
  state.categories=meta.categories||state.categories; state.rules=meta.rules||state.rules;
  state.accounts=meta.accounts||{}; state.recent=meta.recent||[]; state.imports=meta.imports||[]; state.payCycle=meta.payCycle||null; state.dupOk=meta.dupOk||[]; state.autoCat=meta.autoCat!==false; state.projects=meta.projects||[]; state.projSeeded=!!meta.projSeeded; state.budRoll=meta.budRoll||null; state.avatars=meta.avatars||{}; state.tax=meta.tax||null;
  // An older version of the app on another device may have saved without these newer settings: keep ours.
  let repaired=false;
  for(const k of ['projects','projSeeded','dupOk','autoCat','catDeleted','budRoll','avatars','tax']){ if(!(k in meta)&&localNewer[k]!==undefined){ state[k]=localNewer[k]; repaired=true; } }
  if('catDeleted' in meta) state.catDeleted=meta.catDeleted||[];
  runMigrations();
  const merged=mergeDuplicateCats();
  snapBud();
  lastMeta=JSON.stringify(metaOf(state));
  if(seedProjects()||repaired||merged) { lastMeta=''; save(); }
  scheduleRender();
}
// One-time: start the Projects tab with a Farm project.
function normCat(n){ return String(n||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]/g,''); }
// Two categories of the same kind with the same name: keep the one with more transactions, move everything over.
function mergeDuplicateCats(){
  const seen=new Map(); let changed=false;
  for(const c of [...state.categories]){
    const k=c.kind+'|'+normCat(c.name);
    if(!seen.has(k)){ seen.set(k,c); continue; }
    const a=seen.get(k), cnt=x=>state.txns.filter(t=>t.cat===x.id).length;
    const keep=cnt(c)>cnt(a)?c:a, drop=keep===a?c:a;
    state.txns.forEach(t=>{ if(t.cat===drop.id) t.cat=keep.id; if(t.sug===drop.id) t.sug=keep.id; });
    state.rules.forEach(r=>{ if(r.cat===drop.id) r.cat=keep.id; });
    (state.projects||[]).forEach(p=>{ if((p.cats||[]).includes(drop.id)){ p.cats=[...new Set(p.cats.map(x=>x===drop.id?keep.id:x))]; } });
    if(!keep.budget&&drop.budget){ keep.budget=drop.budget; keep.budgetPer=drop.budgetPer; if(drop.billFreq) keep.billFreq=drop.billFreq; }
    state.categories=state.categories.filter(x=>x!==drop);
    state.catDeleted=[...new Set([...(state.catDeleted||[]),drop.id])];
    seen.set(k,keep); changed=true;
  }

}

/* ============ Merchant cleaning & rules ============ */
function cleanDesc(d){
  let s=String(d).toUpperCase();
  s=s.replace(/^AUTHORISATION ONLY - EFTPOS PURCHASE AT\s+/,'');
  s=s.replace(/^(SQ|PAYPAL|DD|GOOGLE|BITE|SP|LS|ZLR|PY|SMP|IZ|TST)\s?\*\s?/,'');
  s=s.replace(/\*/g,' ');
  return s.replace(/\s+/g,' ').trim();
}
function suggestKeyword(d){
  if(/^IB TRANSFER/i.test(d)) return '';
  const words=cleanDesc(d).split(' ');
  const out=[];
  for(const w of words){
    if(/\d/.test(w)) break;
    if(/^(AUS|AU|AUD|QLD|NSW|VIC|USA|US)$/.test(w)) break;
    out.push(w);
    if(out.length===2) break;
  }
  return out.join(' ') || words[0] || '';
}
function kwRegex(kw){
  const e=kw.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return new RegExp('(^|[^A-Z0-9])'+e+'($|[^A-Z0-9])');
}
function ruleMatches(rule,t){
  if(rule.dir==='out' && t.amount>=0) return false;
  if(rule.dir==='in' && t.amount<0) return false;
  const re=kwRegex(rule.kw);
  return re.test(cleanDesc(t.desc)) || re.test(t.desc.toUpperCase());
}
function findRule(t){
  const sorted=[...state.rules].sort((a,b)=>(b.user-a.user)||(b.kw.length-a.kw.length));
  return sorted.find(r=>catById(r.cat) && ruleMatches(r,t));
}

function autoCat(t){
  const m=t.desc.match(OWN_XFER);
  if(m){ ensureAccount(m[2]); return 'transfer'; }
  const r=findRule(t);
  return r? r.cat : null;
}

/* ============ CSV import (Bankwest) ============ */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const rows=[]; let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function importBankwest(text){
  const rows=parseCSV(text);
  if(!rows.length) throw new Error('File is empty');
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=n=>h.findIndex(x=>x===n);
  const ix={bsb:col('bsb number'),acc:col('account number'),date:col('transaction date'),desc:col('narration'),
    deb:col('debit'),cred:col('credit'),bal:col('balance'),type:col('transaction type')};
  if(ix.date<0||ix.desc<0||(ix.deb<0&&ix.cred<0)) throw new Error("This doesn't look like a Bankwest transaction CSV");
  const existing=new Set(state.txns.map(t=>t.id));
  let added=0,dupes=0,pending=0,skipped=0,loansFound=0; const newOnes=[]; const balSeen=new Set();
  for(const r of rows.slice(1)){
    { // latest balance = first row for each account in the file (Bankwest lists newest first)
      const bm=(r[ix.date]||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); const bb=parseFloat(String(r[ix.bal]||'').replace(/[$,]/g,''));
      const ba=normAcct((r[ix.bsb]||'')+(r[ix.acc]||''))||'unknown';
      if(bm&&!isNaN(bb)&&!balSeen.has(ba)){ balSeen.add(ba); ensureAccount(ba); state.accounts[ba].uploaded=new Date().toISOString(); const bd=`${bm[3]}-${bm[2].padStart(2,'0')}-${bm[1].padStart(2,'0')}`; const A=state.accounts[ba]; if(!A.balDate||bd>=A.balDate){ A.bal=bb; A.balDate=bd; } }
    }
    const desc=(r[ix.desc]||'').trim().replace(/\s+/g,' ');
    const type=(r[ix.type]||'').trim().toUpperCase();
    if(type==='DAU'||/^AUTHORISATION ONLY/i.test(desc)){ pending++; continue; }
    const dm=(r[ix.date]||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(!dm){ skipped++; continue; }
    const date=`${dm[3]}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`;
    const deb=parseFloat(String(r[ix.deb]||'').replace(/[$,]/g,''))||0;
    const cred=parseFloat(String(r[ix.cred]||'').replace(/[$,]/g,''))||0;
    const amount=Math.round((cred-Math.abs(deb))*100)/100;
    if(amount===0){ skipped++; continue; }
    const bsb=(r[ix.bsb]||'').trim(), acc=(r[ix.acc]||'').trim();
    const acct=normAcct(bsb+acc)||'unknown';
    const bal=(r[ix.bal]||'').trim();
    const id=[acct,date,desc,amount,bal].join('|');
    if(existing.has(id)){ dupes++; continue; }
    existing.add(id);
    ensureAccount(acct);
    const t={id,acct,date,desc,amount,balance:bal===''?null:parseFloat(bal),type,cat:null,sug:null};
    t.sug=autoCat(t); // a suggestion only: every transaction is confirmed in Review
    newOnes.push(t); added++;
  }
  // A new account with interest charges or a large negative balance is set up as a home loan.
  const fresh=new Set(newOnes.map(t=>t.acct).filter(a=>!state.txns.some(t=>t.acct===a)));
  fresh.forEach(a=>{ const mine=newOnes.filter(t=>t.acct===a); const A=state.accounts[a];
    if(A&&(!A.type||A.type==='everyday')&&mine.some(t=>t.type==='DRI'||(t.balance!=null&&t.balance<-20000))){ A.type='loan'; if(!A.name) A.name='Home loan'; loansFound++; } });
  state.txns.push(...newOnes);
  const rev=newOnes.filter(isCounted);
  return {added,dupes,pending,skipped,loansFound,review:rev.length,loanTx:newOnes.filter(t=>isLoanAcct(t.acct)).length,auto:rev.filter(t=>t.sug).length};
}

function earlyPayDays(){ const n=state.payCycle&&state.payCycle.early; return n==null?2:n; }

function isFortRange(from,to){ return isoAdd(from,13)===to&&fortStartFor(from)===from; }
function incomeDate(t,from,to){
  const n=earlyPayDays(); if(!n||t.amount<=0||!isFortRange(from,to)) return t.date;
  const pay=isPayCat(t.cat)||((!t.cat||catKindOf(t.cat)==='income')&&/\b(PAY|SALARY|WAGES?|PAYROLL)\b/i.test(t.desc)); if(!pay) return t.date;
  const next=fortStartFor(isoAdd(t.date,n)); return next>t.date?next:t.date;
}
function inPeriod(t,from,to){ const d=incomeDate(t,from,to); return d>=from&&d<=to; }
function summarise(from,to){
  const byCat={}; let moneyIn=0, spend=0, uncatOut=0;
  for(const t of state.txns){
    if(!inHH(t)||!inPeriod(t,from,to)) continue;
    const c=t.cat?catById(t.cat):null;
    if(c&&c.kind==='transfer') continue;
    if(c&&c.kind==='income'){ moneyIn+=t.amount; continue; }
    if(!c){ if(t.sug==='transfer'&&OWN_XFER.test(t.desc)) continue; /* clearly between your own accounts */ if(t.amount>0) moneyIn+=t.amount; else { uncatOut+=-t.amount; spend+=-t.amount; } continue; }
    byCat[c.id]=(byCat[c.id]||0)+(-t.amount); spend+=-t.amount;
  }
  return {byCat,moneyIn,spend,uncatOut};
}

// Automatic sorting: transfers between your own accounts, then what you've picked before for this place,
// then the keyword rules. Anything with no match is left for Review.
function autoOn(){ return state.autoCat!==false; }
function autoPick(t){
  if(OWN_XFER.test(t.desc)||transferPairs().partner.has(t.id)) return transferCatId();
  // Learn only from categories you chose yourself, and never call something a transfer unless it looks like one.
  const s=suggestionsFor(t,true).filter(x=>catKindOf(x.id)!=='transfer'||looksXfer(t));
  return s.length?s[0].id:null;
}
let lastAutoXfer=0;
function autoCategorise(){
  if(!autoOn()) return 0; let n=0; lastAutoXfer=0;
  const todo=state.txns.filter(t=>!t.cat&&isCounted(t)).sort((a,b)=>a.date.localeCompare(b.date));
  for(const t of todo){ const c=autoPick(t); if(c){ t.cat=c; t.auto=true; n++; if(catKindOf(c)==='transfer') lastAutoXfer++; } }
  return n;
}
function setAutoCat(on){ state.autoCat=on; let n=0; if(on) n=autoCategorise(); save(); render(); toast(on?(n?`Sorted ${n} automatically`:'Automatic sorting on'):'Automatic sorting off'); }

// Suggestions: what you've picked before for this place (same direction), then any rule match.

// Categories in the order to offer them for this transaction: income first for money coming in,
// expenses first for money going out. Within each group, the ones you use most come first.
function rankCats(list,acct){
  const all={}, mine={};
  for(const x of state.txns){ if(!x.cat) continue; all[x.cat]=(all[x.cat]||0)+1; if(acct&&x.acct===acct) mine[x.cat]=(mine[x.cat]||0)+1; }
  const order=state.categories.map(c=>c.id);
  return list.map(c=>c.id).sort((a,b)=>(mine[b]||0)-(mine[a]||0)||(all[b]||0)-(all[a]||0)||order.indexOf(a)-order.indexOf(b));

function catGroupsFor(t){

/* ============ Double-up checker ============ */
// Money leaving one of your accounts and the same amount arriving in another within 3 days is a transfer.
// If either side was put in a spending or income category, it's probably counted twice.
function shortHash(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36)+str.length.toString(36); }
function transferCatId(){ return catById('transfer')?'transfer':(catsOfKind('transfer')[0]||{}).id; }
function catKindOf(id){ const c=id?catById(id):null; return c?c.kind:null; }
function dayGap(a,b){ return Math.abs((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5); }
function looksXfer(t){ return /^(TFD|TFC)$/.test(t.type||'')||OWN_XFER.test(t.desc); }
let _pairsMemo={sig:'',pairs:[],partner:new Map()};
function transferPairs(){
  // Cached per transaction list object and size, so a fresh import or cloud update always recomputes.
  const sig=state.txns.length+'|'+Object.keys(state.accounts).length+'|'+(state.txns[0]&&state.txns[0].id);
  if(_pairsMemo.sig===sig&&_pairsMemo.list===state.txns&&_pairsMemo.first===state.txns[0]&&_pairsMemo.last===state.txns[state.txns.length-1]) return _pairsMemo;
  const ins=new Map(), used=new Set(), pairs=[], partner=new Map();
  // 1) Bankwest puts the same reference number on both sides of an internet transfer ("IB TRANSFER 1063515367 TO/FROM ...").
  const byRef=new Map();
  for(const t of state.txns){ if(!state.accounts[t.acct]) continue; const m=t.desc.match(/IB TRANSFER\s+(\d{6,})/i); if(!m) continue; if(!byRef.has(m[1])) byRef.set(m[1],[]); byRef.get(m[1]).push(t); }
  for(const list of byRef.values()){
    const o=list.find(t=>t.amount<0), i=list.find(t=>t.amount>0&&t.acct!==(o&&o.acct));
    if(o&&i&&Math.abs(o.amount+i.amount)<0.005){ used.add(o.id); used.add(i.id); pairs.push([o,i]); partner.set(o.id,i); partner.set(i.id,o); }
  }
  // 2) Everything else: same amount out of one account and into another within 3 days.
  for(const t of state.txns) if(t.amount>0&&state.accounts[t.acct]&&!used.has(t.id)){ const k=t.amount.toFixed(2); if(!ins.has(k)) ins.set(k,[]); ins.get(k).push(t); }
  const outs=state.txns.filter(t=>t.amount<0&&state.accounts[t.acct]&&!used.has(t.id)).sort((a,b)=>a.date.localeCompare(b.date));
  for(const o of outs){
    const c=ins.get((-o.amount).toFixed(2)); if(!c) continue;
    let best=null, bd=9;
    for(const i of c){ if(used.has(i.id)||i.acct===o.acct) continue; const d=dayGap(o.date,i.date); if(d>3) continue;
      const linked=looksXfer(o)||looksXfer(i)||cleanDesc(o.desc).toUpperCase()===cleanDesc(i.desc).toUpperCase(); if(!linked) continue;
      if(d<bd){ best=i; bd=d; } }
    if(best){ used.add(best.id); used.add(o.id); pairs.push([o,best]); partner.set(o.id,best); partner.set(best.id,o); }
  }
  _pairsMemo={sig,pairs,partner,list:state.txns,first:state.txns[0],last:state.txns[state.txns.length-1]}; return _pairsMemo;
}
// Words that say nothing about who was paid.
const DUP_STOP=new Set(['TRANSFER','PAYMENT','PAY','FROM','AUS','AUD','PTY','LTD','BILL','THE','AND','FOR','INV','REF','CITY','EAST','WEST','NORTH','SOUTH']);
function descWords(d){ return new Set(cleanDesc(d).toUpperCase().replace(/[^A-Z ]/g,' ').split(/\s+/).filter(w=>w.length>=3&&!DUP_STOP.has(w))); }
// The real bill a transfer was probably covering: same category, close in date (3 days before to 10 days after),
// and either a close amount (rounded transfers: within $5 or 10%) or a matching name with a looser amount.
function realBillFor(x){
  const k=catKindOf(x.cat); if(k!=='expense') return null;
  const a=Math.abs(x.amount), words=descWords(x.desc), partner=transferPairs().partner;
  let best=null, bs=-1e9;
  for(const r of state.txns){
    if(r.id===x.id||r.amount>=0||r.cat!==x.cat||partner.has(r.id)||OWN_XFER.test(r.desc)) continue;
    const days=(new Date(r.date+'T00:00:00')-new Date(x.date+'T00:00:00'))/864e5; if(days<-3||days>10) continue;
    const ra=Math.abs(r.amount), diff=Math.abs(ra-a);
    const close=diff<=Math.max(5,a*.1), loose=diff<=a*.25;
    const named=[...descWords(r.desc)].some(w=>words.has(w));
    if(!(close||(named&&loose))) continue;
    const sc=(named?2:0)+(close?1:0)-Math.abs(days)/30-diff/Math.max(a,1);
    if(sc>bs){ bs=sc; best=r; }
  }
  return best;
}
function doubleUps(){
  const ok=new Set(state.dupOk||[]), out=[], {pairs,partner}=transferPairs(), nums=Object.keys(state.accounts);
  const consider=(xfer,sides)=>{
    // 1) A transfer put in a spending category while the real bill is in the same category: counted twice.
    const bill=realBillFor(xfer);
    if(bill){ const key='d'+shortHash(xfer.id+'|'+bill.id); if(!ok.has(key)) out.push({type:'double',key,sides,xfer,bill}); return true; }
    return false;
  };
  for(const [o,i] of pairs){
    if(consider(o,[o,i])) continue; // the fix for a double-up also sorts out the other side
    // 2) The receiving side of your own transfer put in an income category: not new money.
    if(catKindOf(i.cat)==='income'){ const key='i'+shortHash(o.id+'|'+i.id); if(!ok.has(key)) out.push({type:'income',key,sides:[o,i],inc:i}); }
  }
  // Transfers to/from your own account numbers where the other side isn't imported yet.
  for(const t of state.txns){
    if(partner.has(t.id)) continue; const m=t.desc.match(OWN_XFER); if(!m||!nums.includes(m[2])) continue;
    if(t.amount<0) consider(t,[t]);

  }
  // Reconcile: every transaction marked Transfer needs its other side, the same amount going the other way
  // in another of your accounts within 3 days. One without a partner may really be spending (or income).
  for(const u of unmatchedTransfers()){ const key='u'+shortHash(u.t.id); if(!ok.has(key)) out.push({type:'unmatched',key,sides:[u.t],other:u.other,notImported:u.notImported}); }
  return out;
}
function transferMatches(){
  const {partner}=transferPairs(), used=new Set(partner.keys()), match=new Map(partner);
  const xf=state.txns.filter(t=>catKindOf(t.cat)==='transfer'&&!partner.has(t.id)&&state.accounts[t.acct]).sort((a,b)=>a.date.localeCompare(b.date));
  const byAmt=new Map(); for(const x of state.txns){ if(used.has(x.id)||!state.accounts[x.acct]) continue; const k=Math.abs(x.amount).toFixed(2); if(!byAmt.has(k)) byAmt.set(k,[]); byAmt.get(k).push(x); }
  for(const t of xf){
    if(used.has(t.id)) continue;
    const c=(byAmt.get(Math.abs(t.amount).toFixed(2))||[]).filter(x=>!used.has(x.id)&&x.acct!==t.acct&&Math.sign(x.amount)===-Math.sign(t.amount)&&dayGap(x.date,t.date)<=3);
    if(!c.length) continue;

function catMonthly(id,end,n){

function sparkline(vals,color){
  const W=84,H=26,bw=W/vals.length,max=Math.max(...vals.map(v=>v.a),1);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${vals.map((v,i)=>{const h=Math.max(2,Math.max(v.a,0)/max*(H-2)); return `<rect x="${i*bw+1.5}" y="${H-h}" width="${bw-3}" height="${h}" rx="2" fill="${color}" opacity="${i===vals.length-1?1:.45}"/>`;}).join('')}</svg>`;
}
/* ============ Charts helpers ============ */
function donutSVG(parts,total,label){
  const R=70,r=46,C=90; let a0=-Math.PI/2, paths='';
  const tot=parts.reduce((s,p)=>s+p.v,0)||1;
  parts.forEach(p=>{
    const frac=p.v/tot; if(frac<=0) return;
    const a1=a0+frac*Math.PI*2-(parts.length>1?0.012:0);
    const large=a1-a0>Math.PI?1:0;
    const pt=(ang,rad)=>[C+rad*Math.cos(ang),C+rad*Math.sin(ang)];
    const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r),[x3,y3]=pt(a0,r);
    if(frac>=0.9999) paths+=`<circle cx="${C}" cy="${C}" r="${(R+r)/2}" fill="none" stroke="${p.c}" stroke-width="${R-r}"/>`;
    else paths+=`<path d="M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${large} 0 ${x3},${y3} Z" fill="${p.c}"/>`;
    a0+=frac*Math.PI*2;
  });
  return `<svg viewBox="0 0 180 180" width="170" height="170" class="donut">${paths}
    <text x="90" y="86" text-anchor="middle" font-size="11" style="fill:var(--muted)">${label||'Spent'}</text>
    <text x="90" y="104" text-anchor="middle" font-size="17" font-weight="800" style="fill:var(--ink)">${money0(total)}</text></svg>`;
}
function barChartSVG(labels,series,opts={}){
  // series: [{vals,color}] drawn side by side per label; opts.avg draws a dashed average line for series 0
  const W=600,H=opts.h||200,padL=8,padB=26,padT=22, n=labels.length, g=(W-padL*2)/n;
  const max=Math.max(1,...series.flatMap(s=>s.vals));
  const bw=g*0.7/series.length; let out='';
  labels.forEach((lab,i)=>{
    series.forEach((s,j)=>{
      const v=Math.max(0,s.vals[i]), h=v/max*(H-padB-padT), x=padL+i*g+g*0.15+j*bw, y=H-padB-h;
      out+=`<rect x="${x}" y="${y}" width="${bw-2}" height="${Math.max(h,v?2:0)}" rx="4" style="fill:${s.color}"/>`;
      if(opts.values&&v&&bw>=44) out+=`<text x="${x+(bw-2)/2}" y="${y-5}" text-anchor="middle" font-size="11" style="fill:var(--trendtext)">${money0(v)}</text>`;
    });
    out+=`<text x="${padL+i*g+g/2}" y="${H-8}" text-anchor="middle" font-size="12" style="fill:var(--muted)">${lab}</text>`;
  });
  if(opts.avg){ const y=H-padB-opts.avg/max*(H-padB-padT); out+=`<line x1="${padL}" x2="${W-padL}" y1="${y}" y2="${y}" stroke-dasharray="5 5" style="stroke:var(--muted)" stroke-width="1.5"/>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">${out}</svg>`+(opts.avg?`<div class="small muted chartnote">┄ Average ${money0(opts.avg)}</div>`:'');
}
function monthsBack(end,n){ const a=[]; for(let i=n-1;i>=0;i--) a.push(ymAdd(end,-i)); return a; }

// Every category with its total for the period; tap one to see its transactions.
let chartCatKind='expense';
function chartCatsCard(pr){
  const kind=chartCatKind, tot={}, cnt={};
  let unsorted=0, unsortedN=0;
  for(const t of state.txns){
    if(!inHH(t)||!inPeriod(t,pr.from,pr.to)) continue;
    if(!t.cat){ if((kind==='expense')===(t.amount<0)&&!(t.sug==='transfer'&&OWN_XFER.test(t.desc))){ unsorted+=Math.abs(t.amount); unsortedN++; } continue; }
    if(catKindOf(t.cat)!==kind) continue;
    const v=kind==='expense'?-t.amount:t.amount; tot[t.cat]=(tot[t.cat]||0)+v; cnt[t.cat]=(cnt[t.cat]||0)+1;
  }
  const rows=Object.entries(tot).filter(([,v])=>Math.abs(v)>0.004).sort((a,b)=>b[1]-a[1]);
  const sum=rows.reduce((a,[,v])=>a+v,0), max=Math.max(...rows.map(r=>r[1]),1);
  return `<div class="card chartcats"><div class="ccthead"><h2 style="margin:0">Categories</h2>
      <div class="seg ccseg"><button class="${kind==='expense'?'on':''}" onclick="if(chartCatKind!=='expense'){chartCatKind='expense';render()}">Spending</button><button class="${kind==='income'?'on':''}" onclick="if(chartCatKind!=='income'){chartCatKind='income';render()}">Income</button></div></div>
    <div class="small muted" style="margin:6px 0 4px">${rows.length?`${money(sum)} across ${rows.length} categor${rows.length===1?'y':'ies'} · tap one to see its transactions`:`No ${kind==='expense'?'spending':'income'} sorted in this period yet.`}</div>
    ${rows.map(([id,v])=>{ const c=catById(id); return `<div class="catrow" onclick="filterCat('${id}')">
      <div class="top"><span><span class="dot" style="background:${c.color}"></span>${esc(c.name)} <span class="small muted">· ${cnt[id]}</span></span><span><span class="small muted" style="margin-right:8px">${sum?Math.round(v/sum*100):0}%</span><b>${money(v)}</b> <span class="muted">›</span></span></div>
      <div class="bar"><i style="width:${Math.max(v/max*100,1.5)}%;background:${c.color}"></i></div></div>`; }).join('')}
    ${unsortedN?`<div class="lrow" style="cursor:pointer;margin-top:4px" onclick="txReset({dir:'review',when:'period'});go('tx')"><span class="dot" style="background:var(--muted)"></span><span class="grow">Not sorted yet <span class="small muted">· ${unsortedN}</span></span><b>${money(unsorted)}</b> <span class="muted">›</span></div>`:''}
  </div>`;
}

/* ============ Home loan ============ */
function loanAccts(){ return Object.keys(state.accounts).filter(a=>isLoanAcct(a)&&acctTxCount(a)); }
// What each loan transaction is, from Bankwest's transaction code and description.
function loanKind(t){
  if(t.type==='DRI'||/DEBIT INTEREST/i.test(t.desc)) return 'interest';
  if(t.type==='FEE'||/\bFEE\b/i.test(t.desc)) return 'fee';
  if(t.amount>0&&(t.type==='DEP')) return 'deposit';
  if(t.amount>0) return 'repayment';
  return 'other';
}

function loanInfo(a){

  const tx=state.txns.filter(t=>t.acct===a).sort((p,q)=>p.date.localeCompare(q.date));
  const ints=tx.filter(t=>loanKind(t)==='interest'), lastInt=ints[ints.length-1]||null;
  const first=tx[0]?.date||null, last=tx[tx.length-1]?.date||null;
  const daily=loanDaily(a), drop=daily.length>1?daily[0].owing-daily[daily.length-1].owing:0;

// Drag to reorder (touch and mouse) within a group.
function ceDragStart(e,id){
  e.preventDefault(); e.stopPropagation();
  if(catEd.openId){ catEd.openId=null; drawCatEditor(); }
  const row=document.querySelector(`.ce-row[data-id="${id}"]`); if(!row) return;
  const list=row.parentElement, rows=[...list.querySelectorAll('.ce-row')], from=rows.indexOf(row);
  const h=row.getBoundingClientRect().height+6, y0=e.clientY; let to=from;
  row.classList.add('dragging'); list.classList.add('sorting');
  const move=ev=>{
    const dy=ev.clientY-y0; row.style.transform=`translateY(${dy}px)`;
    to=Math.max(0,Math.min(rows.length-1,from+Math.round(dy/h)));
    rows.forEach((r,i)=>{ if(r===row) return; let sh=0; if(from<to&&i>from&&i<=to) sh=-h; if(to<from&&i>=to&&i<from) sh=h; r.style.transform=sh?`translateY(${sh}px)`:''; });
  };
  const up=()=>{
    document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up);
    if(to!==from){
      const kind=list.dataset.kind, ids=rows.map(r=>r.dataset.id); const [m]=ids.splice(from,1); ids.splice(to,0,m);
      const others=state.categories.filter(c=>c.kind!==kind), group=ids.map(x=>catObj(x));
      // keep groups in the same overall order: rebuild by walking the old list and refilling this kind's slots
      let gi=0; state.categories=state.categories.map(c=>c.kind===kind?group[gi++]:c);
      save(); if(navigator.vibrate) navigator.vibrate(10);
    }
    drawCatEditor();
  };
  document.addEventListener('pointermove',move); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',up);
}

/* ============ Tax set-aside ============ */
// Australian resident rates by financial year (the year it starts). Medicare levy 2% on top.
const TAX_TABLES={
  2024:[[18200,0],[45000,.16],[135000,.30],[190000,.37],[Infinity,.45]],
  2025:[[18200,0],[45000,.16],[135000,.30],[190000,.37],[Infinity,.45]],
  2026:[[18200,0],[45000,.15],[135000,.30],[190000,.37],[Infinity,.45]],
  2027:[[18200,0],[45000,.14],[135000,.30],[190000,.37],[Infinity,.45]]
};
function taxTable(y){ const ks=Object.keys(TAX_TABLES).map(Number); return TAX_TABLES[Math.min(Math.max(y,Math.min(...ks)),Math.max(...ks))]; }
function incomeTax(inc,y){ let t=0,lo=0; for(const [hi,r] of taxTable(y)){ if(inc>lo) t+=(Math.min(inc,hi)-lo)*r; lo=hi; } return t+Math.max(0,inc)*0.02; }
function marginal(inc,y){ let lo=0; for(const [hi,r] of taxTable(y)){ if(inc<=hi) return r; lo=hi; } return .45; }
function fyOf(d){ const y=+d.slice(0,4), m=+d.slice(5,7); return m>=7?y:y-1; }
function fyRange(y){ return {from:y+'-07-01',to:(y+1)+'-06-30',label:y+'–'+String(y+1).slice(2)}; }
function taxCfg(){ if(!state.tax) state.tax={people:[{id:'p1',name:userName()==='You'?'Me':userName(),gross:0},{id:'p2',name:'Partner',gross:0}],projects:[],cats:[],acct:null,est:{},split:{p1:50,p2:50}};
  const t=state.tax; if(!t.split){ t.split={}; const n=t.people.length; t.people.forEach(x=>{ t.split[x.id]=Math.round(100/n); }); } if(!t.est) t.est={}; if(!t.grossBy) t.grossBy={}; return t; }
function taxReady(){ const t=state.tax; return !!(t&&((t.projects||[]).length||(t.cats||[]).length||Object.keys(t.est||{}).length)); }
function curFY(){ return fyOf(new Date().toLocaleDateString('en-CA')); }
// Salary for a year: the figure saved for that year if there is one, otherwise the current salary.
function grossFor(x,y){ const t=taxCfg(); return +((t.grossBy[y]||{})[x.id] ?? x.gross)||0; }
function taxInfo(y){
  const t=taxCfg(), fy=fyRange(y), today=new Date().toLocaleDateString('en-CA'), to=today<fy.to?today:fy.to;
  const src=[];
  (t.projects||[]).forEach(id=>{ const pj=projById(id); if(!pj) return; const q=projSum(pj,fy.from,to); src.push({name:(pj.emoji?pj.emoji+' ':'')+pj.name,inn:q.inn,out:q.out,net:q.inn-q.out}); });
  (t.cats||[]).forEach(id=>{ const c=catById(id); if(!c) return; const inn=state.txns.filter(x=>x.cat===id&&x.amount>0&&inHH(x)&&x.date>=fy.from&&x.date<=to).reduce((a,x)=>a+x.amount,0); src.push({name:c.name,inn,out:0,net:inn}); });
  const sofar=src.reduce((a,x)=>a+x.net,0);
  const days=dayGap(fy.from,fy.to)+1, gone=today<fy.from?0:Math.min(days,dayGap(fy.from,to)+1), frac=gone/days;
  const pace=frac>=1?sofar:frac>0.05?sofar/frac:sofar;
  const e=t.est[y], official=e&&typeof e==='object'?+e.amt:+e||0, est=official>0?official:null, isOfficial=!!(e&&typeof e==='object'&&e.official);
  const base=est!=null?est:Math.max(0,pace);
  const tot=Object.values(t.split).reduce((a,v)=>a+(+v||0),0)||100;
  const people=t.people.map(x=>{ const pct=(+t.split[x.id]||0)/tot; if(pct<=0) return null; const g=grossFor(x,y);
    const share=base*pct, extra=incomeTax(g+share,y)-incomeTax(g,y);
    const owed=est!=null?extra*Math.min(1,frac):incomeTax(g+Math.max(0,sofar)*pct,y)-incomeTax(g,y);
    return {x,pct,g,share,extra,owed,rate:marginal(g+share,y)}; }).filter(Boolean);
  const extra=people.reduce((a,q)=>a+q.extra,0), owedSoFar=people.reduce((a,q)=>a+q.owed,0);
  const aside=t.acct&&state.accounts[t.acct]?(state.accounts[t.acct].bal||0):null;
  return {fy,src,sofar,pace,est,isOfficial,base,people,extra,owedSoFar,aside,frac};
}
function taxCard(compact){
  if(!taxReady()) return '';
  const y=curFY(), i=taxInfo(y), t=taxCfg();
  const short=i.aside!=null?i.owedSoFar-i.aside:null;
  // last year's return, once the accountant's figure is in
  const ly=y-1, le=t.est[ly], L=le?taxInfo(ly):null;
  const lastYr=L&&L.est!=null?`<div class="taxlast"><div class="small muted">${L.fy.label} return · ${L.isOfficial?'official':'estimated'} partnership profit ${money0(L.base)}</div>
      ${L.people.map(q=>`<div class="lrow"><span class="grow">${esc(q.x.name)}'s share ${money0(q.share)}<div class="small muted">On a ${money0(q.g)} salary · top rate ${Math.round(q.rate*100)}% + 2% Medicare</div></span><b>${money0(q.extra)}</b></div>`).join('')}
      <div class="lrow"><span class="grow"><b>Extra tax for ${L.fy.label}</b></span><b>${money0(L.extra)}</b></div></div>`:'';

function taxSet(k,v){ const t=taxCfg(); if(k==='acct') t.acct=v||null; save(); render(); }

function taxSplit(id,v){ const t=taxCfg(); t.split[id]=Math.max(0,Math.min(100,parseFloat(v)||0)); if(t.people.length===2){ const o=t.people.find(q=>q.id!==id); t.split[o.id]=100-t.split[id]; const el=document.getElementById('split-'+o.id); if(el) el.value=t.split[o.id]; } save(); }

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, setDoc, deleteDoc, collection, onSnapshot, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCi0EiGSli65zccgx7RI8RpBoXwRPX5PtQ",
  authDomain: "my-spend-friend-9f55d.firebaseapp.com",
  projectId: "my-spend-friend-9f55d",
  storageBucket: "my-spend-friend-9f55d.firebasestorage.app",
  messagingSenderId: "1091698865385",
  appId: "1:1091698865385:web:3492b8ada690bd041c6c78"
};
// The only login that can add or remove people (must match firestore.rules).
const ADMIN_EMAIL = "nathan.emmerson@hotmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { ignoreUndefinedProperties: true, localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

// Firestore document ids can't contain "/", so each transaction is stored under a hash of its id.
function docId(s){ let h1=0xdeadbeef, h2=0x41c6ce57; for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(36)+(h1>>>0).toString(36); }

const isAdmin = () => (auth.currentUser?.email || "").toLowerCase() === ADMIN_EMAIL;
let unsubs = [], hid = null, metaTimer = null;

window.cloudApi = {
  email: () => auth.currentUser?.email || "",
  isAdmin,
  login: (e, p) => signInWithEmailAndPassword(auth, e, p),
  firstSetup: (e, p) => {
    if (e.trim().toLowerCase() !== ADMIN_EMAIL) return Promise.reject({ message: "First-time setup is only for the main login. Others are added by Nathan in Settings → People." });
    return createUserWithEmailAndPassword(auth, e, p);
  },
  reset: (e) => sendPasswordResetEmail(auth, e),
  logout: () => signOut(auth),
  listMembers: async () => (await getDocs(collection(db, "members"))).docs.map(d => ({ uid: d.id, ...d.data() })),
  addMember: async (name, email, password) => {
    // A second, temporary Firebase app creates the login, so Nathan stays signed in.
    const helper = initializeApp(firebaseConfig, "helper-" + Date.now());
    try {
      const ha = getAuth(helper);
      const cred = await createUserWithEmailAndPassword(ha, email, password);
      await setDoc(doc(db, "members", cred.user.uid), { name, email, household: auth.currentUser.uid, added: new Date().toISOString() });
      await signOut(ha);
    } finally { await deleteApp(helper); }
  },
  removeMember: (uid) => deleteDoc(doc(db, "members", uid)),
};

function startSync(householdId){
  hid = householdId;
  let gotMeta = false, gotTx = false;
  const ready = () => { if (gotMeta && gotTx && appScreen !== "app") showScreen("app"); };
  window.cloud = cloud = {
    saveMeta(meta){ clearTimeout(metaTimer); metaWaiting = meta; metaTimer = setTimeout(() => cloud.flushMeta(), 400); },
    // Send the latest settings now. Only clear "dirty" once every write has finished and nothing newer is waiting,
    // otherwise an older copy coming back from the cloud could overwrite what was just typed.
    flushMeta(){
      clearTimeout(metaTimer); metaTimer = null;
      const meta = metaWaiting; metaWaiting = null;
      if (!meta) return metaLast || Promise.resolve();
      metaPending++;
      const p = setDoc(doc(db, "households", hid), meta, { mergeFields: Object.keys(meta) })
        .finally(() => { metaPending--; if (!metaPending && !metaWaiting) metaDirty = false; });
      metaLast = p; return p;
    },
    async saveTxns(sets, dels){
      const ops = [...sets.map(t => ["set", t]), ...dels.map(id => ["del", id])];
      for (let i = 0; i < ops.length; i += 400) {
        const b = writeBatch(db);
        ops.slice(i, i + 400).forEach(([k, v]) => k === "set" ? b.set(doc(db, "households", hid, "txns", docId(v.id)), v) : b.delete(doc(db, "households", hid, "txns", docId(v))));
        await b.commit();
      }
    },
  };
  unsubs.push(onSnapshot(doc(db, "households", hid), snap => {
    if (!snap.exists()) { if (isAdmin()) setDoc(doc(db, "households", hid), metaOf(freshState())); return; }
    applyCloudMeta(snap.data()); gotMeta = true; ready();
  }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, "households", hid, "txns"), qs => {
    applyCloudTxns(qs.docs.map(d => d.data())); gotTx = true; ready();
  }, err => console.error(err)));
}

onAuthStateChanged(auth, async user => {
  unsubs.forEach(u => u()); unsubs = []; window.cloud = null;
  if (!user) { onSignedOut(); return; }
  showScreen("loading");
  if (isAdmin()) { startSync(user.uid); return; }
  try {
    const m = await getDoc(doc(db, "members", user.uid));
    if (m.exists() && m.data().household) startSync(m.data().household); else showScreen("noaccess");
  } catch (e) { showScreen("noaccess"); }
});
</script>
