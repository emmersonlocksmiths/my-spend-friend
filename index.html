<script>
// Theme: 'auto' follows the phone's light/dark setting; saved per device.
(function(){
  const KEY='myspendfriend.theme', mq=matchMedia('(prefers-color-scheme: light)');
  function apply(){
    let pref='auto'; try{ pref=localStorage.getItem(KEY)||'auto'; }catch(e){}
    const t=pref==='auto'?(mq.matches?'light':'dark'):pref;
    document.documentElement.dataset.theme=t;
    const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=t==='light'?'#f5f4f0':'#0b0b0c';
  }
  window.getThemePref=()=>{ try{ return localStorage.getItem(KEY)||'auto'; }catch(e){ return 'auto'; } };
  window.setThemePref=p=>{ try{ localStorage.setItem(KEY,p); }catch(e){} apply(); };
  (mq.addEventListener?mq.addEventListener('change',apply):mq.addListener(apply));
  apply(); document.addEventListener('DOMContentLoaded',apply);
})();
</script>
<style>

  --track:#272622;--trendbar:#5c4a1c;--trendtext:#e2dfd8;--pending:#6b5418;--navbg:rgba(14,14,17,.96);--placeholder:#6d6d78;--chipfg:#c9c9d2;--autofg:#9fb8ff;
  --toastbg:#ffffff;--toastfg:#111111;--openborder:#4a3e1e;--dashed:#3d3a33;--rawtext:#77746d;--errfg:#ffb3b4;--strong:#ffffff;--glow:rgba(245,179,1,.08);--shadow:rgba(0,0,0,.5);--overlay:rgba(0,0,0,.65);color-scheme:dark}
:root[data-theme=light]{--bg:#f5f4f0;--card:#ffffff;--card2:#f4f2ed;--ink:#1d1c19;--muted:#6e6a61;--line:#e5e2da;--accent:#e3a400;--accent2:#f8bd1c;--soft:rgba(227,164,0,.12);--good:#1d9a42;--bad:#d7373a;--onaccent:#1a1300;
  --track:#ebe8e1;--trendbar:#f1d58a;--trendtext:#3a3833;--pending:#f0d48a;--navbg:rgba(255,255,255,.96);--placeholder:#a5a199;--chipfg:#4f4c45;--autofg:#2f5fc4;
  --toastbg:#1d1c19;--toastfg:#ffffff;--openborder:#ecd28c;--dashed:#d6d1c5;--rawtext:#9a968d;--errfg:#a3222a;--strong:#1d1c19;--glow:rgba(227,164,0,.10);--shadow:rgba(0,0,0,.15);--overlay:rgba(20,18,14,.45);color-scheme:light}
:root[data-theme=light] .card,:root[data-theme=light] .stat{box-shadow:0 1px 2px rgba(0,0,0,.04)}
:root[data-theme=light] nav button .ic{filter:grayscale(1) brightness(.9);opacity:.55}
:root[data-theme=light] nav button.on .ic{filter:none;opacity:1}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-x:none}
html{touch-action:pan-y}
body *{touch-action:manipulation}
/* iPhone zooms into any text box with text under 16px, so keep them all at 16px */
input,select,textarea{font-size:16px!important}
body{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px;font-size:15px;
  background-image:radial-gradient(1200px 500px at 50% -200px,var(--glow),transparent 70%);background-repeat:no-repeat;min-height:100vh;min-height:100dvh}
html{background:var(--bg)}
header{max-width:760px;margin:0 auto;position:relative}
header img{display:block;width:100%;height:auto;aspect-ratio:1400/467;object-fit:cover}
@media(min-width:780px){header{padding:14px 14px 0}header img{border-radius:16px;box-shadow:0 8px 30px rgba(245,179,1,.12)}}
header .info{position:absolute;right:12px;bottom:8px;font-size:11px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);padding:2px 8px;border-radius:8px}
@media(min-width:780px){header .info{right:26px;bottom:8px}}
header .info:empty{display:none}
header .ver{position:absolute;left:8px;top:6px;font-size:9.5px;line-height:1;letter-spacing:.3px;color:rgba(255,255,255,.7);background:rgba(0,0,0,.35);padding:2px 5px;border-radius:5px;pointer-events:none;font-variant-numeric:tabular-nums}
@media(min-width:780px){header .ver{left:22px;top:20px}}
@media(min-width:1000px){header .ver{left:36px;top:24px}}
main{max-width:760px;margin:0 auto;padding:14px}
h2{font-size:15px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--navbg);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;background:none;border:0;font-size:11px;color:var(--muted);padding:5px 2px;position:relative;cursor:pointer;font-family:inherit}
nav button .ic{display:block;font-size:20px;line-height:1.25;filter:grayscale(1) brightness(1.3);opacity:.7}
nav button.on{color:var(--strong);font-weight:600}
nav button.on .ic{filter:none;opacity:1}
.navind{position:absolute;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--accent);box-shadow:0 0 10px var(--accent);
  width:calc(100% / var(--n,5) * .4);left:calc(100% / var(--n,5) * (var(--i,0) + .3));transition:left .28s cubic-bezier(.3,.7,.2,1)}
nav button{transition:color .2s}
nav button .ic{transition:filter .2s,opacity .2s,transform .2s}
nav button.on .ic{transform:translateY(-1px) scale(1.06)}
.badge.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.3)}}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--accent);color:var(--onaccent);border-radius:10px;font-size:10px;padding:1px 6px;font-weight:700}
button.btn{background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--onaccent);border:0;border-radius:11px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 2px 12px rgba(245,179,1,.22)}
button.btn.ghost{background:var(--card2);color:var(--strong);box-shadow:none;border:1px solid var(--line)}
button.btn.danger{background:rgba(255,77,79,.12);color:var(--bad);box-shadow:none}
button.link{background:none;border:0;color:var(--accent);cursor:pointer;font-size:14px;padding:0;font-family:inherit}
input,select{font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--ink);width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input::placeholder{color:var(--placeholder)}
input[type=color]{background:none;border:1px solid var(--line)}
.period{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.period .lbl{flex:1;text-align:center;font-weight:800;font-size:17px}
.period button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:38px;height:36px;font-size:18px;cursor:pointer}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:9px;font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit}

.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .k{font-size:12px;color:var(--muted)}

.banner{background:rgba(245,179,1,.09);border:1px solid rgba(245,179,1,.35);border-radius:14px;padding:11px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.banner.ok{background:rgba(76,217,100,.08);border-color:rgba(76,217,100,.3);display:block}
.catrow{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.catrow:last-child{border-bottom:0}
.catrow .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.bar{height:7px;background:var(--track);border-radius:5px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.budgetnote{font-size:12px;color:var(--muted);margin-top:3px}
.over{color:var(--bad)!important}

.txn:last-child{border-bottom:0}
.txn .mid{flex:1;min-width:0}
.txn .d{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn .s{font-size:12px;color:var(--muted);margin-top:2px}

.neg{color:var(--bad)}

.modal-bg{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border:1px solid var(--line);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}
@media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:20px}}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}
.catgrid button{text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:11px;padding:9px 10px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.catgrid button.sel{border-color:var(--accent);background:var(--soft);font-weight:700}
.rulebox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:6px}
.rulebox.warn{background:rgba(255,77,79,.08);border-color:rgba(255,77,79,.35)}
.rulebox label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.rulebox input[type=checkbox]{width:auto;margin-top:3px;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
.drop{border:2px dashed var(--dashed);border-radius:16px;padding:26px 14px;text-align:center;background:var(--card2);cursor:pointer}
.drop.hover{border-color:var(--accent);background:var(--soft)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row .grow{flex:1}
table.simple{width:100%;border-collapse:collapse;font-size:14px}
table.simple td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.hidden{display:none!important}
ol.steps{padding-left:20px;margin:6px 0;line-height:1.6;font-size:14px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--toastbg);color:var(--toastfg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:60;max-width:90%;box-shadow:0 6px 24px var(--shadow)}
summary{color:var(--accent)}
.chg{font-size:11px;margin-top:3px;white-space:nowrap}
.mini2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini2 .k{font-size:12px;color:var(--muted)}
.mini2 .v{font-size:20px;font-weight:800;margin-top:3px}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.lrow:last-child{border-bottom:0}
.lrow .grow{flex:1;min-width:0}
.rank{width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.rvhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:6px}
.rvcard{padding:12px 14px;margin-bottom:10px}
.rvtop{display:flex;align-items:flex-start;gap:10px}
.rvname{font-size:17px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rvamt{font-size:20px;font-weight:800;white-space:nowrap}
.rvraw{font-size:11px;color:var(--rawtext);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rvrem{display:flex;align-items:center;gap:7px;margin-top:9px}
.rvrem input[type=checkbox]{width:auto;margin:0}
.rvrem input.grow{flex:1;padding:6px 9px;font-size:13px}
.qpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.qpgrid button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px 8px;font-size:13px;font-weight:600;text-align:left;cursor:pointer;font-family:inherit;line-height:1.2;display:flex;align-items:center;min-height:50px}
.qpgrid button .dot{flex:none}
.qpgrid button:active{border-color:var(--accent);background:var(--soft)}
.sharebar{display:flex;height:12px;border-radius:7px;overflow:hidden;margin-top:12px;gap:2px}
.sharebar i{display:block;height:100%}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini3 .k{font-size:11px;color:var(--muted)}
.mini3 .v{font-size:18px;font-weight:800;margin-top:2px}
.catcard{cursor:pointer;padding:14px}
.catcard.open{border-color:var(--openborder)}
.cc-top{display:flex;align-items:center;gap:12px}
.cc-ic{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.cc-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-amt{font-weight:800;font-size:16px;margin-bottom:2px}
.catcard .bar{margin-top:10px}
.catdetail{margin-top:10px;padding-top:12px;border-top:1px dashed var(--line);cursor:default}
.catlist{padding:4px 14px}
.crow{padding:11px 0 10px;border-bottom:1px solid var(--line);cursor:pointer}
.crow:last-child{border-bottom:0}
.crow-top{display:flex;align-items:center;gap:9px;font-size:14px}
.crow-name{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow-pct{font-size:11px;color:var(--muted);white-space:nowrap}
.crow-chg{font-size:11px;white-space:nowrap}
.crow-amt{white-space:nowrap;min-width:78px;text-align:right}
.crow-chev{color:var(--muted);width:10px;text-align:center}
.crow-bar{height:3px;background:var(--track);border-radius:2px;margin:7px 0 0 19px;overflow:hidden}
.crow-bar i{display:block;height:100%;border-radius:2px}
.crow-meta{margin-top:8px;padding-left:19px;line-height:26px}
.crow.open .catdetail{padding-left:19px}
nav button{font-size:10px}
.acct{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card2)}
.acct input,.acct select{background:var(--bg)}
.suggrow{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.suggrow button{display:flex;align-items:center;gap:4px;text-align:left;border:1.5px solid var(--accent);background:var(--soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;cursor:pointer;font-family:inherit}
.suggrow button b{display:block}
.suggrow button .why{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.suggrow button.sel{background:var(--accent);color:var(--onaccent)}
.authwrap{max-width:420px;margin:24px auto;padding:0 4px}
.authcard{padding:22px}
.authcard input{background:var(--bg)}
.authmsg{background:rgba(255,77,79,.1);border:1px solid rgba(255,77,79,.35);color:var(--errfg);border-radius:10px;padding:9px 11px;font-size:13px;margin:4px 0 10px}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:40px auto 14px;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- Transitions ---------- */
.anim-tab{animation:tabIn .24s cubic-bezier(.2,.7,.2,1)}
@keyframes tabIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim-fade{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:.25}to{opacity:1}}
.anim-left{animation:inFromRight .22s cubic-bezier(.2,.7,.2,1)}
.anim-right{animation:inFromLeft .22s cubic-bezier(.2,.7,.2,1)}
@keyframes inFromRight{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inFromLeft{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.rvanim{transition:transform .15s ease,opacity .15s ease}
.rvanim.out-left{transform:translateX(-36px);opacity:0}
.rvanim.out-right{transform:translateX(36px);opacity:0}
.qpgrid button.picked,.suggrow button.picked,.catgrid button.picked{border-color:var(--accent);background:var(--soft);transform:scale(.97)}
.modal-bg{animation:bgIn .2s ease}
.modal-bg .modal{animation:sheetUp .26s cubic-bezier(.2,.8,.2,1)}
.modal-bg.closing{animation:bgOut .2s ease forwards}
.modal-bg.closing .modal{animation:sheetDown .2s ease forwards}
@keyframes bgIn{from{opacity:0}}
@keyframes bgOut{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}}
@keyframes sheetDown{to{transform:translateY(40px);opacity:0}}
@media(min-width:600px){@keyframes sheetUp{from{transform:translateY(16px) scale(.98);opacity:0}}}
.anim-open{animation:openDown .22s cubic-bezier(.2,.7,.2,1)}
@keyframes openDown{from{opacity:0;transform:translateY(-6px)}}
details[open]>summary~*{animation:openDown .2s ease}
.toast{animation:toastIn .22s cubic-bezier(.2,.8,.2,1)}
.toast.hide{transition:opacity .25s,transform .25s;opacity:0;transform:translateX(-50%) translateY(8px)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}}
button,.btn,.catrow,.crow,.txn,.lrow,.chip,.seg button,.qpgrid button,.suggrow button,.catgrid button,.period button{transition:transform .12s ease,background-color .2s,border-color .2s,color .2s,box-shadow .2s,opacity .2s}
button:active:not(:disabled),.txn:active,.catrow:active,.crow:active{transform:scale(.97)}
.txn:active,.crow:active,.catrow:active{transform:scale(.99)}
.bar i,.crow-bar i,.sharebar i{transition:width .35s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.donutwrap{display:flex;align-items:center;gap:14px}
.donut{flex:none}
.legend{flex:1;min-width:0}
.lg{display:flex;align-items:center;gap:7px;font-size:13px;padding:3px 0}

.mini3 > div{margin-bottom:6px}
.rvctl{display:flex;gap:6px;align-items:center}
.pill{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;min-width:34px}

.cols>.card{break-inside:avoid}
.navlogo{display:none}

<script>
/* App version: bump on every push (and VERSION in sw.js to match). */
const APP_VERSION='0.30';

/* ============ Storage (Firebase cloud sync) ============ */
// Data lives in Firestore (see the module script at the bottom). save() works out what changed
// since the last sync and sends only that: changed/removed transactions and the household settings.
const VIEW_KEY='myspendfriend.view';
let cloud=null;                 // set once signed in: {saveMeta(meta), saveTxns(sets,dels)}
let synced=new Map();           // transaction id -> JSON as last synced
let lastMeta='';                // household settings JSON as last synced
let metaDirty=false;            // local settings change not yet sent
function metaOf(s){ return {categories:s.categories,rules:s.rules,accounts:s.accounts||{},recent:s.recent||[],imports:(s.imports||[]).slice(-50),payCycle:s.payCycle||null}; }
function save(){
  try{ localStorage.setItem(VIEW_KEY,JSON.stringify(state.view)); }catch(e){}
  if(!cloud) return;
  const m=JSON.stringify(metaOf(state));
  if(m!==lastMeta){ lastMeta=m; metaDirty=true; cloud.saveMeta(JSON.parse(m)); }
  const sets=[],dels=[],now=new Set();
  for(const t of state.txns){ now.add(t.id); const j=JSON.stringify(t); if(synced.get(t.id)!==j){ sets.push(t); synced.set(t.id,j); } }
  for(const id of [...synced.keys()]) if(!now.has(id)){ dels.push(id); synced.delete(id); }
  if(sets.length||dels.length) cloud.saveTxns(sets,dels);
}
let renderQueued=false;
function scheduleRender(){ if(renderQueued) return; renderQueued=true; requestAnimationFrame(()=>{ renderQueued=false; if(appScreen==='app') render(); }); }
// Called by the Firebase module when data arrives (first load, or a change from another phone).
function applyCloudMeta(meta){
  if(metaDirty) return; // our own newer change is on its way
  if(!meta){ return; }
  state.categories=meta.categories||state.categories; state.rules=meta.rules||state.rules;
  state.accounts=meta.accounts||{}; state.recent=meta.recent||[]; state.imports=meta.imports||[]; state.payCycle=meta.payCycle||null;
  runMigrations();
  lastMeta=JSON.stringify(metaOf(state));
  scheduleRender();
}
function applyCloudTxns(list){
  state.txns=list;
  synced=new Map(list.map(t=>[t.id,JSON.stringify(t)]));
  scheduleRender();
}

/* ============ Defaults ============ */
const PALETTE = ['#1f6feb','#e8590c','#2f9e44','#ae3ec9','#f08c00','#0c8599','#d6336c','#5c7cfa','#74b816','#c2255c','#1098ad','#7048e8','#f76707','#37b24d','#e64980','#4263eb','#fab005','#12b886','#868e96'];
const DEFAULT_CATS = [
  ['rent','Rent'],['utilities','Electricity'],['water','Water'],['phone','Phone & Internet'],['groceries','Groceries'],
  ['eatingout','Cafés & Eating Out'],['takeaway','Takeaway'],['fuel','Fuel'],['car','Car servicing'],['insurance','Insurance'],
  ['health','Health & Medical'],['kids','Kids'],['clothing','Clothing'],['shopping','Household & Shopping'],
  ['home','Home & Garden'],['subs','Subscriptions & Entertainment'],['giving','Church & Giving'],['gifts','Gifts'],
  ['fees','Fees & Charges'],['other','Other']
];

/* ============ Merchant cleaning & rules ============ */
function cleanDesc(d){
  let s=String(d).toUpperCase();
  s=s.replace(/^AUTHORISATION ONLY - EFTPOS PURCHASE AT\s+/,'');
  s=s.replace(/^(SQ|PAYPAL|DD|GOOGLE|BITE|SP|LS|ZLR|PY|SMP|IZ|TST)\s?\*\s?/,'');
  s=s.replace(/\*/g,' ');
  return s.replace(/\s+/g,' ').trim();
}
function suggestKeyword(d){
  if(/^IB TRANSFER/i.test(d)) return '';
  const words=cleanDesc(d).split(' ');
  const out=[];
  for(const w of words){
    if(/\d/.test(w)) break;
    if(/^(AUS|AU|AUD|QLD|NSW|VIC|USA|US)$/.test(w)) break;
    out.push(w);
    if(out.length===2) break;
  }
  return out.join(' ') || words[0] || '';
}
function kwRegex(kw){
  const e=kw.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return new RegExp('(^|[^A-Z0-9])'+e+'($|[^A-Z0-9])');
}
function ruleMatches(rule,t){
  if(rule.dir==='out' && t.amount>=0) return false;
  if(rule.dir==='in' && t.amount<0) return false;
  const re=kwRegex(rule.kw);
  return re.test(cleanDesc(t.desc)) || re.test(t.desc.toUpperCase());
}
function findRule(t){
  const sorted=[...state.rules].sort((a,b)=>(b.user-a.user)||(b.kw.length-a.kw.length));
  return sorted.find(r=>catById(r.cat) && ruleMatches(r,t));
}
const OWN_XFER = /IB TRANSFER\s+\d+\s+(FROM|TO)\s+(\d{3}-\d{3}-\d+)/i;
function autoCat(t){
  const m=t.desc.match(OWN_XFER);
  if(m){ ensureAccount(m[2]); return 'transfer'; }
  const r=findRule(t);
  return r? r.cat : null;
}
function ensureAccount(a){ if(!state.accounts[a]) state.accounts[a]={name:'',mine:true,type:'everyday',owner:'',counted:true}; }

/* ============ CSV import (Bankwest) ============ */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const rows=[]; let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function importBankwest(text){
  const rows=parseCSV(text);
  if(!rows.length) throw new Error('File is empty');
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=n=>h.findIndex(x=>x===n);
  const ix={bsb:col('bsb number'),acc:col('account number'),date:col('transaction date'),desc:col('narration'),
    deb:col('debit'),cred:col('credit'),bal:col('balance'),type:col('transaction type')};
  if(ix.date<0||ix.desc<0||(ix.deb<0&&ix.cred<0)) throw new Error("This doesn't look like a Bankwest transaction CSV");
  const existing=new Set(state.txns.map(t=>t.id));
  let added=0,dupes=0,pending=0,skipped=0,loansFound=0; const newOnes=[]; const balSeen=new Set();
  for(const r of rows.slice(1)){
    { // latest balance = first row for each account in the file (Bankwest lists newest first)
      const bm=(r[ix.date]||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); const bb=parseFloat(String(r[ix.bal]||'').replace(/[$,]/g,''));
      const ba=normAcct((r[ix.bsb]||'')+(r[ix.acc]||''))||'unknown';
      if(bm&&!isNaN(bb)&&!balSeen.has(ba)){ balSeen.add(ba); ensureAccount(ba); state.accounts[ba].uploaded=new Date().toISOString(); const bd=`${bm[3]}-${bm[2].padStart(2,'0')}-${bm[1].padStart(2,'0')}`; const A=state.accounts[ba]; if(!A.balDate||bd>=A.balDate){ A.bal=bb; A.balDate=bd; } }
    }
    const desc=(r[ix.desc]||'').trim().replace(/\s+/g,' ');
    const type=(r[ix.type]||'').trim().toUpperCase();
    if(type==='DAU'||/^AUTHORISATION ONLY/i.test(desc)){ pending++; continue; }
    const dm=(r[ix.date]||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(!dm){ skipped++; continue; }
    const date=`${dm[3]}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`;
    const deb=parseFloat(String(r[ix.deb]||'').replace(/[$,]/g,''))||0;
    const cred=parseFloat(String(r[ix.cred]||'').replace(/[$,]/g,''))||0;
    const amount=Math.round((cred-Math.abs(deb))*100)/100;
    if(amount===0){ skipped++; continue; }
    const bsb=(r[ix.bsb]||'').trim(), acc=(r[ix.acc]||'').trim();
    const acct=normAcct(bsb+acc)||'unknown';
    const bal=(r[ix.bal]||'').trim();
    const id=[acct,date,desc,amount,bal].join('|');
    if(existing.has(id)){ dupes++; continue; }
    existing.add(id);
    ensureAccount(acct);
    const t={id,acct,date,desc,amount,balance:bal===''?null:parseFloat(bal),type,cat:null,sug:null};
    t.sug=autoCat(t); // a suggestion only: every transaction is confirmed in Review
    newOnes.push(t); added++;
  }
  // A new account with interest charges or a large negative balance is set up as a home loan.
  const fresh=new Set(newOnes.map(t=>t.acct).filter(a=>!state.txns.some(t=>t.acct===a)));
  fresh.forEach(a=>{ const mine=newOnes.filter(t=>t.acct===a); const A=state.accounts[a];
    if(A&&(!A.type||A.type==='everyday')&&mine.some(t=>t.type==='DRI'||(t.balance!=null&&t.balance<-20000))){ A.type='loan'; if(!A.name) A.name='Home loan'; loansFound++; } });
  state.txns.push(...newOnes);
  const rev=newOnes.filter(isCounted);
  return {added,dupes,pending,skipped,loansFound,review:rev.length,loanTx:newOnes.filter(t=>isLoanAcct(t.acct)).length,auto:rev.filter(t=>t.sug).length};
}

/* ============ Period & maths ============ */
function latestYM(){
  if(!state.txns.length){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  return state.txns.reduce((m,t)=>t.date>m?t.date:m,'').slice(0,7);
}
function summarise(from,to){
  const byCat={}; let moneyIn=0, spend=0, uncatOut=0;
  for(const t of state.txns){
    if(t.date<from||t.date>to||!isCounted(t)) continue;
    const c=t.cat?catById(t.cat):null;
    if(c&&c.kind==='transfer') continue;
    if(c&&c.kind==='income'){ moneyIn+=t.amount; continue; }
    if(!c){ if(t.sug==='transfer'&&OWN_XFER.test(t.desc)) continue; /* clearly between your own accounts */ if(t.amount>0) moneyIn+=t.amount; else { uncatOut+=-t.amount; spend+=-t.amount; } continue; }
    byCat[c.id]=(byCat[c.id]||0)+(-t.amount); spend+=-t.amount;
  }
  return {byCat,moneyIn,spend,uncatOut};
}
function uncatCount(){ return state.txns.filter(t=>!t.cat&&isCounted(t)).length; }

// Transitions: the next render plays this animation on the page ('tab', 'fade', 'left', 'right').
let nextAnim=null, periodDir=null, pillFrom=null, morphNext=false;
// Seamless period changes: bars and chart columns move from their old size to the new one.
const barMemo={}, rectMemo={};
function morphKey(n){ const r=n.closest('.catrow,.crow,.lrow,.card,.stat'); const lab=r?(r.querySelector('.crow-name,.top>span,h2')?.textContent||''):''; return tab+'|'+(acctSel||'')+'|'+(loanSel||'')+'|'+lab; }
function morphAfterRender(el,animate){
  const anim=animate&&!reducedMotion();
  const counts={};
  el.querySelectorAll('.bar i,.crow-bar i,.sharebar i').forEach(n=>{
    let k=morphKey(n); counts[k]=(counts[k]||0)+1; k+='#'+counts[k];
    const target=n.style.width, prev=barMemo[k]; barMemo[k]=target;
    if(anim&&prev!=null&&prev!==target){ n.style.transition='none'; n.style.width=prev; void n.offsetWidth; n.style.transition='width .5s cubic-bezier(.2,.7,.2,1)'; n.style.width=target; }
    else if(anim&&prev==null){ n.style.transition='none'; n.style.width='0%'; void n.offsetWidth; n.style.transition='width .5s cubic-bezier(.2,.7,.2,1)'; n.style.width=target; }
  });
  el.querySelectorAll('svg').forEach((svg,si)=>{
    const card=svg.closest('.card'); const lab=tab+'|'+(acctSel||'')+'|'+((card&&card.querySelector('h2')?.textContent)||si);
    let changed=false;
    svg.querySelectorAll('rect').forEach((r,ri)=>{
      if(r.getAttribute('fill')==='transparent'||!r.hasAttribute('height')) return;
      const k=lab+'|'+ri, y=+r.getAttribute('y'), h=+r.getAttribute('height'), prev=rectMemo[k]; rectMemo[k]={y,h};
      if(anim&&prev&&(Math.abs(prev.y-y)>.5||Math.abs(prev.h-h)>.5)){ changed=true;
        r.setAttribute('y',prev.y); r.setAttribute('height',prev.h);
        const t0=performance.now(), D=480; const step=now=>{ const q=Math.min(1,(now-t0)/D), e=1-Math.pow(1-q,3);
          r.setAttribute('y',prev.y+(y-prev.y)*e); r.setAttribute('height',Math.max(0,prev.h+(h-prev.h)*e)); if(q<1&&r.isConnected) requestAnimationFrame(step); };
        requestAnimationFrame(step); }
    });
    if(changed) svg.querySelectorAll('text').forEach(t=>{ t.style.opacity='0'; t.style.transition='opacity .25s ease .35s'; requestAnimationFrame(()=>requestAnimationFrame(()=>{ t.style.opacity='1'; })); });
  });
}

const numMemo={};
function animateNumbers(el){
  const nodes=el.querySelectorAll('.stat .v, .mini2 .v, .mini3 .v, .loanbig, .crow-amt, .ar-bal');
  const seen=new Set();
  nodes.forEach((n,i)=>{
    const tn=[...n.childNodes].find(c=>c.nodeType===3&&c.textContent.trim()); if(!tn) return;
    const txt=tn.textContent.trim(), m=txt.match(/^([+−-]?)(\$?)([\d,]+(?:\.(\d+))?)(%?)$/); if(!m) return;
    const key=tab+':'+(acctSel||'')+':'+(n.closest('.card,.stat')?.querySelector('.k,h2')?.textContent||'')+':'+i; seen.add(key);
    const val=(m[1]==='−'||m[1]==='-'?-1:1)*parseFloat(m[3].replace(/,/g,'')), dec=m[4]?m[4].length:0;
    const prev=numMemo[key]; numMemo[key]=val;
    if(prev==null||prev===val||reducedMotion()||Math.abs(prev-val)<0.005) return;
    const fmt=v=>{ const neg=v<0; const body=Math.abs(v).toLocaleString('en-AU',{minimumFractionDigits:dec,maximumFractionDigits:dec}); return (neg?'−':(m[1]==='+'?'+':''))+m[2]+body+m[5]; };
    const t0=performance.now(), D=420;
    const step=now=>{ const k=Math.min(1,(now-t0)/D), e=1-Math.pow(1-k,3); tn.textContent=fmt(prev+(val-prev)*e)+(txt.endsWith(' ')?' ':''); if(k<1&&tn.isConnected) requestAnimationFrame(step); else tn.textContent=txt; };
    requestAnimationFrame(step);
  });
}

function donutSVG(parts,total){
  const R=70,r=46,C=90; let a0=-Math.PI/2, paths='';
  const tot=parts.reduce((s,p)=>s+p.v,0)||1;
  parts.forEach(p=>{
    const frac=p.v/tot; if(frac<=0) return;
    const a1=a0+frac*Math.PI*2-(parts.length>1?0.012:0);
    const large=a1-a0>Math.PI?1:0;
    const pt=(ang,rad)=>[C+rad*Math.cos(ang),C+rad*Math.sin(ang)];
    const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r),[x3,y3]=pt(a0,r);
    if(frac>=0.9999) paths+=`<circle cx="${C}" cy="${C}" r="${(R+r)/2}" fill="none" stroke="${p.c}" stroke-width="${R-r}"/>`;
    else paths+=`<path d="M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${large} 0 ${x3},${y3} Z" fill="${p.c}"/>`;
    a0+=frac*Math.PI*2;
  });
  return `<svg viewBox="0 0 180 180" width="170" height="170" class="donut">${paths}
    <text x="90" y="86" text-anchor="middle" font-size="11" style="fill:var(--muted)">Spent</text>
    <text x="90" y="104" text-anchor="middle" font-size="17" font-weight="800" style="fill:var(--ink)">${money0(total)}</text></svg>`;

function barChartSVG(labels,series,opts={}){

  const max=Math.max(1,...series.flatMap(s=>s.vals));

  labels.forEach((lab,i)=>{
    series.forEach((s,j)=>{
      const v=Math.max(0,s.vals[i]), h=v/max*(H-padB-padT), x=padL+i*g+g*0.15+j*bw, y=H-padB-h;
      out+=`<rect x="${x}" y="${y}" width="${bw-2}" height="${Math.max(h,v?2:0)}" rx="4" style="fill:${s.color}"/>`;
      if(opts.values&&v) out+=`<text x="${x+(bw-2)/2}" y="${y-5}" text-anchor="middle" font-size="11" style="fill:var(--trendtext)">${money0(v)}</text>`;
    });

  });

  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${out}</svg>`;

/* ============ Home loan ============ */
function loanAccts(){ return Object.keys(state.accounts).filter(a=>isLoanAcct(a)&&acctTxCount(a)); }
// What each loan transaction is, from Bankwest's transaction code and description.
function loanKind(t){
  if(t.type==='DRI'||/DEBIT INTEREST/i.test(t.desc)) return 'interest';
  if(t.type==='FEE'||/\bFEE\b/i.test(t.desc)) return 'fee';
  if(t.amount>0&&(t.type==='DEP')) return 'deposit';
  if(t.amount>0) return 'repayment';
  return 'other';
}
const LOAN_LABEL={interest:'Interest',fee:'Fees',deposit:'Deposits',repayment:'Repayments',other:'Other'};
function offsetSaving(t){ const m=t.desc.match(/OFFSET SAVING OF\s*\$?([\d,]+\.\d{2})/i); return m?parseFloat(m[1].replace(/,/g,'')):0; }
// End-of-day balance owing (positive number) for each date, worked out from the running balances.
function loanDaily(a){
  const byDate={};
  state.txns.filter(t=>t.acct===a&&t.balance!=null).forEach(t=>{ (byDate[t.date]=byDate[t.date]||[]).push(t); });
  return Object.keys(byDate).sort().map(d=>{
    const rows=byDate[d], befores=new Set(rows.map(t=>Math.round((t.balance-t.amount)*100)));
    const end=rows.find(t=>!befores.has(Math.round(t.balance*100)))||rows[0];
    return {d,owing:-end.balance};
  });
}
function loanSummary(a,from,to){
  const tx=state.txns.filter(t=>t.acct===a&&t.date>=from&&t.date<=to);
  const sum=k=>tx.filter(t=>loanKind(t)===k).reduce((s,t)=>s+Math.abs(t.amount),0);
  const interest=sum('interest'), fees=sum('fee'), deposits=sum('deposit'), repay=sum('repayment');
  const saved=tx.reduce((s,t)=>s+offsetSaving(t),0);
  return {tx,interest,fees,deposits,repay,paidIn:deposits+repay,principal:deposits+repay-interest-fees,saved};
}

function loanLineSVG(a,opts={}){
  const daily=loanDaily(a); if(daily.length<2) return '';
  const W=600,H=opts.h||200,pl=8,pb=opts.mini?4:24,pt=opts.mini?4:24, min=Math.min(...daily.map(p=>p.owing)), max=Math.max(...daily.map(p=>p.owing));
  const t0=new Date(daily[0].d).getTime(), t1=new Date(daily[daily.length-1].d).getTime();
  const X=d=>pl+(new Date(d).getTime()-t0)/(Math.max(t1-t0,1))*(W-pl*2), Y=v=>pt+(max===min?0.5:(max-v)/(max-min))*(H-pt-pb);
  const pts=daily.map(p=>`${X(p.d).toFixed(1)},${Y(p.owing).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" ${opts.mini?`style="height:${opts.px||46}px"`:''}><polyline points="${pl},${H-pb} ${pts} ${W-pl},${H-pb}" style="fill:var(--soft);stroke:none"/>
    <polyline points="${pts}" fill="none" style="stroke:var(--accent)" stroke-width="${opts.mini?3:2.5}" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${opts.mini?'':daily.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p.owing)}" r="3" style="fill:var(--accent)"/>`).join('')+`
    <text x="${pl}" y="14" font-size="11" style="fill:var(--muted)">${money0(max)}</text>
    <text x="${W-pl}" y="${H-6}" text-anchor="end" font-size="11" style="fill:var(--muted)">${dayLabel(daily[daily.length-1].d).replace(/ \d{4}$/,'')}</text>
    <text x="${pl}" y="${H-6}" font-size="11" style="fill:var(--muted)">${dayLabel(daily[0].d).replace(/ \d{4}$/,'')}</text>`}</svg>`;
}
// Approximate yearly rate from the latest interest charge: (interest + offset saving) / balance x 12.
function loanRate(a){
  const it=state.txns.filter(t=>t.acct===a&&loanKind(t)==='interest'&&t.balance!=null).sort((p,q)=>q.date.localeCompare(p.date))[0];
  if(!it) return null; const owing=-(it.balance-it.amount); if(owing<=0) return null;
  return (Math.abs(it.amount)+offsetSaving(it))/owing*12*100;
}

// Drag accounts up and down (touch and mouse) within their section.
function acctDragStart(e,id,sel){
  sel=sel||'.acctrow';
  e.preventDefault(); e.stopPropagation();
  const row=document.querySelector(`${sel}[data-id="${id}"]`); if(!row) return;
  const list=row.parentElement, rows=[...list.querySelectorAll(sel)], from=rows.indexOf(row);
  const gap=parseFloat(getComputedStyle(row).marginBottom)||0, h=row.getBoundingClientRect().height+gap, y0=e.clientY; let to=from;
  row.classList.add('dragging'); list.classList.add('sorting');
  const move=ev=>{ const dy=ev.clientY-y0; row.style.transform=`translateY(${dy}px)`;
    to=Math.max(0,Math.min(rows.length-1,from+Math.round(dy/h)));
    rows.forEach((r,i)=>{ if(r===row) return; let sh=0; if(from<to&&i>from&&i<=to) sh=-h; if(to<from&&i>=to&&i<from) sh=h; r.style.transform=sh?`translateY(${sh}px)`:''; }); };
  const up=()=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up);
    if(to!==from){ const ids=rows.map(r=>r.dataset.id); const [m]=ids.splice(from,1); ids.splice(to,0,m);
      // give every account a position (this section first keeps its new order; others keep theirs)
      const all=acctSort(Object.keys(state.accounts)); const others=all.filter(a=>!ids.includes(a));
      const start=all.indexOf(rows[0].dataset.id)<0?0:Math.min(...ids.map(a=>all.indexOf(a)));
      const merged=[...others.slice(0,start),...ids,...others.slice(start)];
      merged.forEach((a,i)=>{ state.accounts[a].order=i; }); save(); if(navigator.vibrate) navigator.vibrate(10); }
    render(); };
  document.addEventListener('pointermove',move); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',up);
}

// Drag to reorder (touch and mouse) within a group.
function ceDragStart(e,id){
  e.preventDefault(); e.stopPropagation();
  if(catEd.openId){ catEd.openId=null; drawCatEditor(); }
  const row=document.querySelector(`.ce-row[data-id="${id}"]`); if(!row) return;
  const list=row.parentElement, rows=[...list.querySelectorAll('.ce-row')], from=rows.indexOf(row);
  const h=row.getBoundingClientRect().height+6, y0=e.clientY; let to=from;
  row.classList.add('dragging'); list.classList.add('sorting');
  const move=ev=>{
    const dy=ev.clientY-y0; row.style.transform=`translateY(${dy}px)`;
    to=Math.max(0,Math.min(rows.length-1,from+Math.round(dy/h)));
    rows.forEach((r,i)=>{ if(r===row) return; let sh=0; if(from<to&&i>from&&i<=to) sh=-h; if(to<from&&i>=to&&i<from) sh=h; r.style.transform=sh?`translateY(${sh}px)`:''; });
  };
  const up=()=>{
    document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up);
    if(to!==from){
      const kind=list.dataset.kind, ids=rows.map(r=>r.dataset.id); const [m]=ids.splice(from,1); ids.splice(to,0,m);
      const others=state.categories.filter(c=>c.kind!==kind), group=ids.map(x=>catObj(x));
      // keep groups in the same overall order: rebuild by walking the old list and refilling this kind's slots
      let gi=0; state.categories=state.categories.map(c=>c.kind===kind?group[gi++]:c);
      save(); if(navigator.vibrate) navigator.vibrate(10);
    }
    drawCatEditor();
  };
  document.addEventListener('pointermove',move); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',up);
}
function closeCatEditor(){
  closeModal();
  const r=catEd.returnTo; catEd={delId:null,openId:null,returnTo:null};
  render();
  if(r&&pick) drawPicker();
}
function catObj(id){ return state.categories.find(c=>c.id===id); }
function catRename(id,v){ v=v.trim(); if(!v) return drawCatEditor(); catObj(id).name=v; save(); }
function catColor(id,v){ catObj(id).color=v; save(); }
function catBudget(id,v){ catObj(id).budget=parseFloat(v)||0; save(); }
function catMove(id,d){
  // move within its own group (Income / Expenses)
  const a=state.categories, i=a.findIndex(c=>c.id===id), k=a[i].kind;
  let j=i+d; while(j>=0&&j<a.length&&a[j].kind!==k) j+=d;
  if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; save(); drawCatEditor();
}
function catKind(id,k){ const c=catObj(id); if(c.kind===k) return; c.kind=k; if(k!=='expense') c.budget=0; save(); drawCatEditor(); toast(`${c.name} moved to ${k==='income'?'Income':'Expenses'}`); }
function addCat(){
  const el=document.getElementById('newCat'); const v=el.value.trim(); if(!v) return;
  if(state.categories.some(c=>c.name.toLowerCase()===v.toLowerCase())){ toast('That category already exists'); return; }

  const n0=state.categories.length;
  state.categories.push({id:'c'+Date.now().toString(36),name:v,color:kind==='income'?'#38d9a9':PALETTE[n0%PALETTE.length],kind,budget:0});

function catDelete(id){
  const sel=document.getElementById('delTarget'); const to=sel?sel.value:'';
  const c=catObj(id);
  state.txns.forEach(t=>{ if(t.cat===id){ t.cat=to||null; } if(t.sug===id) t.sug=to||null; });
  if(to) state.rules.forEach(r=>{ if(r.cat===id) r.cat=to; }); else state.rules=state.rules.filter(r=>r.cat!==id);
  state.categories=state.categories.filter(x=>x.id!==id);

}

  closePicker&&document.getElementById('modalRoot')&&(document.getElementById('modalRoot').innerHTML='');
  if(name==='loading'){ el.innerHTML=`<div class="authwrap"><div class="spinner"></div><p class="muted" style="text-align:center">Loading your spending…</p></div>`; return; }
  if(name==='noaccess'){ el.innerHTML=`<div class="authwrap"><div class="card authcard"><h2>No access yet</h2><p class="muted">You're signed in as <b>${esc(window.cloudApi?.email()||'')}</b>, but this login hasn't been given access. Ask Nathan to add you in Settings → People.</p><button class="btn ghost" onclick="cloudApi.logout()">Sign out</button></div></div>`; return; }
  if(name==='login') drawLogin();
}
function drawLogin(){
  const create=authMode==='create';
  document.getElementById('app').innerHTML=`<div class="authwrap"><form class="card authcard" onsubmit="event.preventDefault();doAuth()">
    <h2 style="font-size:19px">${create?'Set up your login':'Sign in'}</h2>
    <p class="small muted" style="margin-top:-4px">${create?'First time only: create the main login for My Spend Friend.':'Your spending is private to your household.'}</p>

    <input id="auEmail" type="email" autocomplete="username" required style="margin:4px 0 10px">
    <label class="small muted">Password</label>
    <input id="auPass" type="password" autocomplete="${create?'new-password':'current-password'}" required minlength="6" style="margin:4px 0 10px">
    ${create?`<label class="small muted">Confirm password</label><input id="auPass2" type="password" autocomplete="new-password" required minlength="6" style="margin:4px 0 10px">`:''}
    ${authMsg?`<div class="authmsg">${esc(authMsg)}</div>`:''}
    <button class="btn" type="submit" id="auBtn" style="width:100%;padding:13px;margin-top:4px">${create?'Create login':'Sign in'}</button>
    <div style="display:flex;justify-content:space-between;margin-top:14px">
      ${create?`<button type="button" class="link small" onclick="authMode='login';authMsg='';drawLogin()">‹ Back to sign in</button><span></span>`
        :`<button type="button" class="link small" onclick="doReset()">Forgot password?</button><button type="button" class="link small" onclick="authMode='create';authMsg='';drawLogin()">First-time setup</button>`}

  </form></div>`;
}
const AUTH_ERRORS={'auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/user-not-found':'No login with that email.','auth/too-many-requests':'Too many tries. Wait a few minutes and try again.','auth/email-already-in-use':'That email already has a login. Use Sign in instead.','auth/weak-password':'Use at least 6 characters.','auth/invalid-email':"That email doesn't look right.",'auth/network-request-failed':'No internet connection.'};
function authError(e){ return AUTH_ERRORS[e&&e.code]||(e&&e.message)||'Something went wrong.'; }
async function doAuth(){
  const email=document.getElementById('auEmail').value.trim(), pass=document.getElementById('auPass').value;
  const btn=document.getElementById('auBtn'); btn.disabled=true; btn.textContent='Please wait…';
  try{
    if(authMode==='create'){
      if(pass!==document.getElementById('auPass2').value) throw {message:"The passwords don't match."};
      await cloudApi.firstSetup(email,pass);
    } else await cloudApi.login(email,pass);
    authMsg=''; authMode='login';
  }catch(e){ authMsg=authError(e); drawLogin(); document.getElementById('auEmail').value=email; }
}
async function doReset(){
  const email=document.getElementById('auEmail').value.trim();
  if(!email){ authMsg='Type your email above first, then tap Forgot password.'; drawLogin(); return; }
  try{ await cloudApi.reset(email); authMsg='Password reset email sent to '+email+'.'; }catch(e){ authMsg=authError(e); }
  drawLogin(); document.getElementById('auEmail').value=email;
}
function onSignedOut(){ cloud=null; state=freshState(); synced=new Map(); lastMeta=''; metaDirty=false; showScreen('login'); }

/* ============ Pay cycle setting ============ */
function payCycleCard(){
  const today=new Date(); const td=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');

function setPayStart(d){ state.payCycle={start:d}; state.view.fAnchor=fortStartFor(latestDate()); save(); render(); toast('Fortnights now start on '+['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'][new Date(d+'T00:00:00').getDay()]); }

/* ============ People (admin only) ============ */
let people=null, personForm=false;
function accountSection(){
  const admin=window.cloudApi&&cloudApi.isAdmin();
  return `<div class="card"><h2>Login</h2>
    <div class="row" style="margin:0"><span class="grow small">Signed in as <b>${esc(window.cloudApi?cloudApi.email():'')}</b>${admin?' · admin':''}</span><button class="btn ghost" onclick="cloudApi.logout()">Sign out</button></div>
  </div>
  ${admin?`<div class="card"><h2>People</h2>
    <p class="small muted" style="margin-top:-6px">Everyone you add shares this household's accounts, transactions and categories, and can review and import.</p>

      <div id="pMsg" class="authmsg hidden"></div>
      <div style="display:flex;gap:8px"><button class="btn" id="pBtn" onclick="addPerson()">Add person</button><button class="btn ghost" onclick="personForm=false;render()">Cancel</button></div>
    </div>`:`<button class="btn ghost" style="margin-top:8px" onclick="personForm=true;render();setTimeout(()=>document.getElementById('pName')?.focus(),30)">＋ Add person</button>`}
  </div>`:''}`;
}
function peopleHtml(){
  if(people===null){ loadPeople(); return '<p class="small muted">Loading…</p>'; }
  const me=`<div class="lrow"><span class="grow">${esc(cloudApi.email())}<div class="small muted">You (admin)</div></span></div>`;
  return me+people.map(p=>`<div class="lrow"><span class="grow">${esc(p.name||p.email)}<div class="small muted">${esc(p.email)}</div></span><button class="link small" style="color:var(--bad)" onclick="removePerson('${p.uid}')">Remove</button></div>`).join('');
}
async function loadPeople(){ try{ people=await cloudApi.listMembers(); }catch(e){ people=[]; } const el=document.getElementById('peopleList'); if(el) el.innerHTML=peopleHtml(); }
async function addPerson(){
  const name=document.getElementById('pName').value.trim(), email=document.getElementById('pEmail').value.trim(), pass=document.getElementById('pPass').value;
  const msg=document.getElementById('pMsg'), btn=document.getElementById('pBtn');
  if(!email||pass.length<6){ msg.textContent='Enter their email and a password of at least 6 characters.'; msg.classList.remove('hidden'); return; }
  btn.disabled=true; btn.textContent='Adding…';
  try{ await cloudApi.addMember(name,email,pass); personForm=false; people=null; render(); toast(`${name||email} can now sign in`); }
  catch(e){ msg.textContent=authError(e); msg.classList.remove('hidden'); btn.disabled=false; btn.textContent='Add person'; }
}
async function removePerson(uid){
  const p=(people||[]).find(x=>x.uid===uid);
  if(!confirmBox(`Remove ${p?(p.name||p.email):'this person'}? They lose access straight away.`)) return;
  await cloudApi.removeMember(uid); people=null; render(); toast('Removed');
}

// Stop pinch-zoom and double-tap zoom so the app always fits the screen.
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});
let lastTouchEnd=0; document.addEventListener('touchend',e=>{ const now=Date.now(); if(now-lastTouchEnd<=300&&!e.target.closest('input,select,textarea')) e.preventDefault(); lastTouchEnd=now; },{passive:false});
// ---------- Desktop extras ----------
function isDesktop(){ return matchMedia('(min-width: 1000px)').matches; }
// Review keyboard shortcuts
document.addEventListener('keydown',e=>{
  if(appScreen!=='app') return;
  const typing=e.target.closest('input,textarea,select');
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing&&tab==='review'&&rv.undo){ e.preventDefault(); reviewUndo(); return; }
  if(typing||e.ctrlKey||e.metaKey||e.altKey) return;
  if(document.querySelector('.modal-bg')){ if(e.key==='Escape'){ pick?closePicker():closeCatEditor(); } return; }
  if(tab!=='review'||rv.list) return;
  if(/^[1-9]$/.test(e.key)){ const b=document.querySelector(`.rvanim [data-key="${e.key}"]`); if(b){ e.preventDefault(); b.click(); } }
  else if(e.key==='Enter'){ const b=document.querySelector('.rvanim [data-key="1"]'); if(b){ e.preventDefault(); b.click(); } }
  else if(e.key==='ArrowRight'){ e.preventDefault(); reviewStep(1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); reviewStep(-1); }
});
// Drop Bankwest CSVs anywhere on the page to import them
(function(){
  let depth=0; const ov=document.createElement('div'); ov.className='dropall'; ov.innerHTML='<div>📄 Drop Bankwest CSV files to import</div>';
  const hasFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
  document.addEventListener('dragenter',e=>{ if(appScreen!=='app'||!hasFiles(e)) return; depth++; if(!ov.isConnected) document.body.appendChild(ov); ov.classList.add('on'); });
  document.addEventListener('dragover',e=>{ if(appScreen==='app'&&hasFiles(e)) e.preventDefault(); });
  document.addEventListener('dragleave',e=>{ if(!hasFiles(e)) return; depth=Math.max(0,depth-1); if(!depth) ov.classList.remove('on'); });
  document.addEventListener('drop',e=>{ if(appScreen!=='app'||!hasFiles(e)) return; e.preventDefault(); depth=0; ov.classList.remove('on');
    if(e.target.closest('#drop')) return; // the Settings drop box handles its own
    const files=[...e.dataTransfer.files].filter(f=>/\.csv$/i.test(f.name)); if(!files.length){ toast('Only .csv files can be imported'); return; }
    tab='settings'; animateNext('tab'); handleFiles(files); window.scrollTo({top:0}); });
})();
addEventListener('scroll',()=>{ const pb=document.querySelector('.periodbar'); if(pb) pb.classList.toggle('stuck',pb.getBoundingClientRect().top<=1&&scrollY>40); },{passive:true});
let wasDesktop=isDesktop(); addEventListener('resize',()=>{ const d=isDesktop(); if(d!==wasDesktop){ wasDesktop=d; render(); } });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
showScreen('loading');
</script>
<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, setDoc, deleteDoc, collection, onSnapshot, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCi0EiGSli65zccgx7RI8RpBoXwRPX5PtQ",
  authDomain: "my-spend-friend-9f55d.firebaseapp.com",
  projectId: "my-spend-friend-9f55d",
  storageBucket: "my-spend-friend-9f55d.firebasestorage.app",
  messagingSenderId: "1091698865385",
  appId: "1:1091698865385:web:3492b8ada690bd041c6c78"
};
// The only login that can add or remove people (must match firestore.rules).
const ADMIN_EMAIL = "nathan.emmerson@hotmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { ignoreUndefinedProperties: true, localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

// Firestore document ids can't contain "/", so each transaction is stored under a hash of its id.
function docId(s){ let h1=0xdeadbeef, h2=0x41c6ce57; for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(36)+(h1>>>0).toString(36); }

const isAdmin = () => (auth.currentUser?.email || "").toLowerCase() === ADMIN_EMAIL;
let unsubs = [], hid = null, metaTimer = null;

window.cloudApi = {
  email: () => auth.currentUser?.email || "",
  isAdmin,
  login: (e, p) => signInWithEmailAndPassword(auth, e, p),
  firstSetup: (e, p) => {
    if (e.trim().toLowerCase() !== ADMIN_EMAIL) return Promise.reject({ message: "First-time setup is only for the main login. Others are added by Nathan in Settings → People." });
    return createUserWithEmailAndPassword(auth, e, p);
  },
  reset: (e) => sendPasswordResetEmail(auth, e),
  logout: () => signOut(auth),
  listMembers: async () => (await getDocs(collection(db, "members"))).docs.map(d => ({ uid: d.id, ...d.data() })),
  addMember: async (name, email, password) => {
    // A second, temporary Firebase app creates the login, so Nathan stays signed in.
    const helper = initializeApp(firebaseConfig, "helper-" + Date.now());
    try {
      const ha = getAuth(helper);
      const cred = await createUserWithEmailAndPassword(ha, email, password);
      await setDoc(doc(db, "members", cred.user.uid), { name, email, household: auth.currentUser.uid, added: new Date().toISOString() });
      await signOut(ha);
    } finally { await deleteApp(helper); }
  },
  removeMember: (uid) => deleteDoc(doc(db, "members", uid)),
};

function startSync(householdId){
  hid = householdId;
  let gotMeta = false, gotTx = false;
  const ready = () => { if (gotMeta && gotTx && appScreen !== "app") showScreen("app"); };
  window.cloud = cloud = {
    saveMeta(meta){ clearTimeout(metaTimer); metaTimer = setTimeout(() => { setDoc(doc(db, "households", hid), meta).finally(() => { metaDirty = false; }); }, 400); },
    async saveTxns(sets, dels){
      const ops = [...sets.map(t => ["set", t]), ...dels.map(id => ["del", id])];
      for (let i = 0; i < ops.length; i += 400) {
        const b = writeBatch(db);
        ops.slice(i, i + 400).forEach(([k, v]) => k === "set" ? b.set(doc(db, "households", hid, "txns", docId(v.id)), v) : b.delete(doc(db, "households", hid, "txns", docId(v))));
        await b.commit();
      }
    },
  };
  unsubs.push(onSnapshot(doc(db, "households", hid), snap => {
    if (!snap.exists()) { if (isAdmin()) setDoc(doc(db, "households", hid), metaOf(freshState())); return; }
    applyCloudMeta(snap.data()); gotMeta = true; ready();
  }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, "households", hid, "txns"), qs => {
    applyCloudTxns(qs.docs.map(d => d.data())); gotTx = true; ready();
  }, err => console.error(err)));
}

onAuthStateChanged(auth, async user => {
  unsubs.forEach(u => u()); unsubs = []; window.cloud = null;
  if (!user) { onSignedOut(); return; }
  showScreen("loading");
  if (isAdmin()) { startSync(user.uid); return; }
  try {
    const m = await getDoc(doc(db, "members", user.uid));
    if (m.exists() && m.data().household) startSync(m.data().household); else showScreen("noaccess");
  } catch (e) { showScreen("noaccess"); }
});
</script>
